  ['#','User','Follower B (stale)','Fix: sticky replica = hash(user_id) % replicas','g',2],
  ['#','User','Follower B (stale)','Consistent prefix: answer seen before the question','a',3]]},
 cap:['The first read hits a fresh replica and shows 3 comments.','The refresh hits a staler replica and shows 2. The user sees data disappear. <b>Monotonic reads</b> means never going backwards.','The fix: each user always reads from the same replica (hash of user ID). If it fails, re-route.','<b>Consistent prefix reads</b>: across partitions a reader can see a reply before the message it replies to. The fix is to keep causally related writes in the same partition, for example partitioning chat by conversation_id.'],
 cards:[['why','Interview link','WhatsApp and Messenger partition by <b>conversation_id</b> so messages in a chat keep their order. That is the consistent-prefix guarantee.']]},
{sec:'Ch 5 · Replication',t:'Multi-leader replication',k:'Multi-region writes',
 d:{w:800,h:340,
  z:[[20,30,330,290,'Region: Singapore','b'],[450,30,330,290,'Region: Frankfurt','p']],
  n:[['u1',120,90,'User A','t','pill'],['L1',230,190,'Leader SG','a','db'],['u2',680,90,'User B','t','pill'],['L2',570,190,'Leader EU','a','db'],
     ['c',400,290,'CONFLICT: title = "B" or "C"?','r','pill',2]],
  e:[['u1','L1','title="B"','',1],['u2','L2','title="C"','',1],['L1','L2','async replication','a2',0],['L1','c','','rd',2],['L2','c','','rd',2]]},
 cap:['One leader per region. Each accepts local writes (low latency) and replicates asynchronously to the other.','Two users edit the same record in different regions at the same moment. Both succeed locally.','When the changes meet, there is a <b>conflict</b>. Resolution options: last-write-wins (silently loses data), merge values, CRDTs, or ask the user.'],
 cards:[['why','Best fix: avoid conflicts','Route each user, or each record, to a <b>home region</b>. Their writes always go to one leader, and conflicts only happen during failover.'],
  ['q',null,'Google Docs and CRDT editors are multi-leader: every client is a "leader" that merges concurrent edits.']]},
{sec:'Ch 5 · Replication',t:'Leaderless replication and quorums (Dynamo, Cassandra)',k:'Leaderless',
 d:{w:800,h:340,
  n:[['c',110,170,'Client','t','pill'],['n1',430,70,'Node 1|v7 ✓','g','db'],['n2',430,170,'Node 2|v7 ✓','g','db'],['n3',430,270,'Node 3|v6 (was down)','r','db'],
     ['rr',680,270,'read repair|write v7 back','a',null,3]],
  e:[['c','n1','write v7','g',0],['c','n2','write v7','g',0],['c','n3','✗ missed','rd',0],['n1','c','read → v7','bc',1],['n3','c','read → v6','rdC',1],['n3','rr','','a',3],['rr','n3','fixed','ac',3]],
  t:[[110,240,'n=3, w=2, r=2','a',2,13,'m',700],[110,262,'w + r > n → overlap','a',2,12],[110,282,'at least 1 node has latest','a',2,12]]},
 cap:['No leader. The client (or coordinator) sends the write to all 3 replicas. Node 3 is down, but 2 of 3 acks is enough (<b>w=2</b>).','Reads also go to several nodes (<b>r=2</b>). One may return stale v6.','Because <b>w + r &gt; n</b>, the read set and write set overlap, so at least one response has the latest version. Pick the highest version.','<b>Read repair</b> writes the latest value back to the stale node. A background <b>anti-entropy</b> process (Merkle trees) fixes values that are never read.'],
 cards:[['num','Tuning','n=3, w=2, r=2 is balanced. w=3, r=1 gives fast reads and fragile writes. w=1, r=3 gives fast writes. Cassandra\'s <b>QUORUM</b> = ⌊n/2⌋+1.']]},
{sec:'Ch 5 · Replication',t:'Quorum edge cases',k:'Leaderless · caveats',
 tbl:{h:['Concept','What it is','Gotcha'],r:[
  ['Sloppy quorum','If home nodes are unreachable, write to any w reachable nodes','Higher write availability, but w+r>n no longer guarantees you read the latest'],
  ['Hinted handoff','Temporary node keeps a "hint" and forwards when home node returns','Data is eventually delivered'],
  ['Concurrent writes','Two clients write the same key at once','Nodes may apply them in different orders, so you need conflict resolution'],
  ['Last-write-wins (LWW)','Highest timestamp wins','Drops concurrent writes silently, and clock skew can drop newer ones (Ch 8). Cassandra default.'],
  ['Version vectors','Per-replica counters to detect concurrency','Shows "these two writes are concurrent": keep both (siblings) or merge'],
  ['Quorum ≠ linearizable','Even with w+r>n','Timing edge cases still exist (Ch 9); use consensus for strict guarantees']]},
 cards:[['say',null,'"Cassandra with QUORUM reads and writes at RF=3 tolerates one node down. For counters I\'d avoid LWW and use Cassandra counters or a Redis INCR."']]},
{sec:'Ch 5 · Replication',t:'Interview angle: Chapter 5',k:'Chapter 5 → interview',
 c2:[['q',null,'"Your DB primary dies. What happens?"<br>→ Automated failover promotes a replica (Patroni, RDS Multi-AZ, ~30s). With async replication the last seconds of writes can be lost, so use sync commit for money.'],
  ['q',null,'"User updates a price and refreshes but sees the old price."<br>→ Replication lag. Read-your-writes: route that user to the primary for N seconds, or track LSN.'],
  ['q',null,'"Multi-region active-active?"<br>→ Multi-leader with conflict risk. Prefer a <b>home region per user or hotel</b>, and CRDTs for things like counters.'],
  ['q',null,'"Why Cassandra over Postgres replicas?"<br>→ Leaderless: no failover pause, tunable consistency, write availability during node loss. The cost is conflicts and LWW.']]},

/* ───────── CH 6 ───────── */
{sec:'Ch 6 · Partitioning',type:'title',k:'Chapter 6',t:'Partitioning (Sharding)',
 s:'When data or write load is too big for one machine, split it. Each record belongs to exactly one partition. The goals are to spread data and load evenly, avoid <b>hot spots</b>, and move as little data as possible when nodes are added.',
 chips:['key-range','hash partitioning','hot spots','secondary indexes','rebalancing','consistent hashing','request routing']},
{sec:'Ch 6 · Partitioning',t:'Key-range vs hash partitioning',k:'How to split',
 d:{w:800,h:330,
  z:[[15,20,770,135,'By key range: sorted, like encyclopedia volumes','b'],[15,175,770,140,'By hash of key: even spread','g',1]],
  n:[['r1',120,90,'P1: A – F','b','db'],['r2',300,90,'P2: G – M','b','db'],['r3',480,90,'P3: N – S','b','db'],['r4',660,90,'P4: T – Z','b','db'],
     ['h1',120,250,'P1: hash 0–25%','g','db',1],['h2',300,250,'P2: 25–50%','g','db',1],['h3',480,250,'P3: 50–75%','g','db',1],['h4',660,250,'P4: 75–100%','g','db',1]],
  t:[[400,145,'✓ range scans   ✗ timestamp keys → all of today\'s writes hit the LAST partition','a',0,11.5],[400,305,'✓ even load   ✗ range scans hit ALL partitions (Cassandra: hash partition key, sort by clustering key)','a',1,11.5]]},
 cap:['<b>Key range</b>: efficient range queries. But sequential keys (timestamps, auto-increment IDs) send all writes to one partition, a hot spot.','<b>Hash</b>: hash(key) spreads keys evenly, so load is uniform. You lose range queries on the key. The compound-key trick: hash the first part (user_id), sort within it by the second (timestamp).'],
 cards:[['say',null,'"I\'ll partition messages by hash(conversation_id) and cluster by message timestamp, so one conversation\'s history is a single-partition range scan."']]},
{sec:'Ch 6 · Partitioning',t:'Skew and hot spots: the celebrity problem',k:'Hot keys',
 d:{w:800,h:330,
  n:[['w',110,165,'10M writes/sec\nfor key "Messi"','r',null,0,150],['p',400,165,'One partition|melting 🔥','r','db'],
     ['k0',640,60,'Messi#00','g','db',1],['k1',640,130,'Messi#01','g','db',1],['k2',640,200,'…','g','db',1],['k3',640,270,'Messi#99','g','db',1],
     ['rd',400,300,'reads: query 100 keys + merge','a','pill',2]],
  e:[['w','p','all hash the same','r',0],['p','k0','random suffix','g',1],['p','k1','','g',1],['p','k2','','g',1],['p','k3','','g',1]]},
 cap:['Hashing can\'t fix a single hot <b>key</b>. Every write for "Messi" goes to the same partition.','Split the key: append a random suffix 00–99 so writes spread over 100 partitions.','The cost moves to reads, which must fetch all 100 sub-keys and merge. Only do this for keys you <b>know</b> are hot, and track which ones those are.'],
 cards:[['why','Interview examples','Live comments on a celebrity post, Ticketmaster\'s Taylor Swift on-sale, YouTube view counters, an ad campaign\'s click counter. All use <b>key splitting or write buffering</b>.']]},
{sec:'Ch 6 · Partitioning',t:'Secondary indexes: local vs global',k:'Partitioning + indexes',
 d:{w:800,h:340,
  z:[[15,15,375,310,'Local (document-partitioned)','b'],[410,15,375,310,'Global (term-partitioned)','g',1]],
  n:[['q1',200,60,'WHERE color=red','t','pill'],['a1',90,180,'P1|cars 1–500\nindex: red→[3,9]','b',null,0,135],['a2',300,180,'P2|cars 501–999\nindex: red→[612]','b',null,0,140],['m',200,290,'scatter / gather','r','pill'],
     ['q2',600,60,'WHERE color=red','t','pill',1],['g1',500,180,'Index P-A|colors a–r\nred→[3,9,612]','g',null,1,140],['g2',700,180,'Index P-B|colors s–z','g',null,1,120],['w2',600,290,'writes update remote index (async)','a','pill',1]],
  e:[['q1','a1','','r',0],['q1','a2','','r',0],['q2','g1','1 partition','g',1]]},
 cap:['<b>Local</b>: each partition indexes only its own documents. Writes are simple (one partition), but a query by color must ask <b>every</b> partition and merge, so tail latency compounds. Used by MongoDB, Cassandra, and Elasticsearch shards.','<b>Global</b>: the index itself is partitioned by term. A read hits one index partition, but a write must update index partitions on other nodes, usually <b>asynchronously</b>, so the index lags. Used by DynamoDB GSIs.'],
 cards:[['trap','DynamoDB GSI','Global secondary indexes are <b>eventually consistent</b>. A read right after a write via the GSI may miss it.']]},
{sec:'Ch 6 · Partitioning',t:'Rebalancing: never use hash mod N',k:'Adding nodes',
 d:{w:800,h:330,
  n:[['m1',160,70,'hash(k) % 3 → node 1','b'],['m2',160,130,'hash(k) % 4 → node 3','r'],['mx',160,195,'~75% of keys move ✗','r','pill'],
     ['n1',470,90,'Node A|P1 P2 P3 P4','b','db',1,140],['n2',650,90,'Node B|P5 P6 P7 P8','b','db',1,140],
     ['n3',560,250,'New Node C|P4 P8 (stolen)','g','db',2,160],['ok',300,290,'only 2 of 8 partitions move ✓','g','pill',2]],
  e:[['m1','m2','add node','r',0],['n1','n3','P4','g',2],['n2','n3','P8','g',2]]},
 cap:['With mod N, changing N from 3 to 4 changes the answer for about 75% of keys, so almost all data moves.','Better: create <b>many more partitions than nodes</b> up front (for example 1,000 partitions on 10 nodes). Key→partition never changes; only partition→node does.','A new node <b>steals a few whole partitions</b> from each existing node. Used by Elasticsearch, Kafka, Riak, and Couchbase. Consistent hashing (next slide) is the ring version of this idea.'],
 cards:[['why','Other strategies','<b>Dynamic</b>: split a partition when it grows past ~10GB (HBase, MongoDB). <b>Per-node</b>: a fixed number of partitions per node (Cassandra vnodes).']]},
{sec:'Ch 6 · Partitioning',t:'Consistent hashing: the ring',k:'Consistent hashing',
 d:{w:800,h:360,
  t:[[400,183,'hash ring','x',0,12],[400,200,'0 … 2³²','x',0,11]],
  n:[['ring',400,180,'','x','o',0,280,280],
     ['A',400,40,'Node A','b','pill'],['B',540,180,'Node B','b','pill'],['C',400,320,'Node C','b','pill'],['D',260,180,'Node D','b','pill'],
     ['k1',505,85,'key 1','a','pill',1],['k2',300,285,'key 2','a','pill',1],
     ['E',505,275,'Node E (new)','g','pill',2],
     ['v',680,90,'virtual nodes:\neach server = 100–200\npoints on the ring','p','n',3,190]],
  e:[['k1','B','clockwise →','a',1],['k2','D','→','a',1],['E','C','takes keys between\nB and E only','gd',2]]},
 cap:['Hash both nodes and keys onto the same circle.','A key belongs to the <b>first node clockwise</b> from it.','Add node E: only keys between B and E move (from C to E). That is about 1/N of the data, not 75%.','With few nodes, arcs are uneven. <b>Virtual nodes</b> place each server at many points so load evens out, and a bigger server gets more points.'],
 cards:[['say',null,'"Cache keys are placed on a consistent-hash ring with virtual nodes, so adding a cache node remaps only about 1/N of keys and avoids a cold-cache stampede on the database."']]},
{sec:'Ch 6 · Partitioning',t:'Request routing: who knows where key K lives?',k:'Service discovery',
 d:{w:800,h:330,
  n:[['c1',120,70,'Client','t','pill'],['any',360,70,'Any node','b',null,0],['own',600,70,'Owner node','g'],
     ['c2',120,175,'Client','t','pill'],['rt',360,175,'Routing tier','a',null,1],['own2',600,175,'Owner node','g',null,1],
     ['c3',120,280,'Partition-aware\nclient','t','pill',2],['own3',600,280,'Owner node','g',null,2],
     ['zk',360,280,'ZooKeeper / etcd|partition → node map','p','db',3]],
  e:[['c1','any','','',0],['any','own','forward\n(gossip)','',0],['c2','rt','','a',1],['rt','own2','','a',1],['c3','own3','direct','g',2],['zk','rt','watch','pd',3],['zk','c3','','pd',3]]},
 cap:['① Contact any node, which forwards the request if needed. Nodes learn the map via <b>gossip</b>. Used by Cassandra and Riak.','② A partition-aware <b>routing tier</b> forwards the request. Used by MongoDB mongos and Vitess VTGate.','③ A <b>smart client</b> knows the map and goes straight to the owner. Used by Kafka clients, Redis Cluster clients, and Cassandra drivers.','The map itself lives in a coordination service (ZooKeeper, etcd, KRaft), and routers or clients <b>watch</b> it for changes.']},
{sec:'Ch 6 · Partitioning',t:'Interview angle: Chapter 6',k:'Chapter 6 → interview',
 c2:[['q',null,'"How would you shard this?"<br>→ Name the <b>shard key</b> from the hottest query: "hash(user_id), because every hot query filters by user". Then name the cost: cross-user queries scatter.'],
  ['q',null,'"What about the celebrity or hot hotel?"<br>→ Key splitting with a suffix, write buffering in Redis or Kafka, and a cache in front for reads.'],
  ['q',null,'"Adding shards later?"<br>→ Pre-split into many logical partitions (e.g., 1024) mapped to few physical nodes, or consistent hashing. Never mod N.'],
  ['trap','Sharding too early','A single Postgres handles ~10–50k TPS and multiple TB. Shard only when the <b>calculation</b> says one primary can\'t take the write load.']]},

/* ───────── CH 7 ───────── */
{sec:'Ch 7 · Transactions',type:'title',k:'Chapter 7',t:'Transactions',
 s:'A transaction groups reads and writes into one unit: all of it happens or none of it does, and concurrent transactions don\'t see each other\'s half-finished work. Most interview "contention" questions, such as seat booking, inventory, payments, and auctions, come down to which <b>isolation anomaly</b> you are defending against.',
 chips:['ACID','dirty reads','read skew','MVCC','lost update','write skew','phantoms','2PL','SSI']},
{sec:'Ch 7 · Transactions',t:'What ACID really means',k:'ACID',
 tbl:{h:['Letter','Common belief','What it actually guarantees'],r:[
  ['A · Atomicity','"Atomic like threads"','<b>Abortability</b>: on any error mid-transaction, all writes are rolled back. Safe to retry.'],
  ['C · Consistency','"DB keeps data consistent"','Your <b>application\'s invariants</b> (debits = credits). This one is mostly the app\'s job, not the DB\'s.'],
  ['I · Isolation','"Transactions are serial"','Concurrent transactions don\'t interfere. The strength depends on the <b>isolation level</b>, and most DBs default to weaker than serializable.'],
  ['D · Durability','"Never lost"','Committed data survives crashes (WAL + fsync, or replication). Nothing is 100%.']]},
 cards:[['trap','The default is not serializable','Postgres defaults to <b>Read Committed</b>. MySQL InnoDB defaults to Repeatable Read. Neither prevents write skew, so your booking code can double-book unless you add locks.']]},
{sec:'Ch 7 · Transactions',t:'Read committed: no dirty reads, no dirty writes',k:'Weakest useful level',
 seq:{a:['Tx 1|a','Database|b','Tx 2|p'],m:[
  ['Tx 1','Database','UPDATE balance = 0 (not committed)','',0],
  ['Tx 2','Database','SELECT balance','',1],
  ['Database','Tx 2','sees 0 ✗ dirty read','r',1],
  ['Tx 1','Database','ROLLBACK','r',2],
  ['#','Tx 2',null,'Tx 2 acted on data that never existed','r',2],
  ['#','Tx 1','Tx 2','Read committed: Tx 2 sees the OLD value until Tx 1 commits','g',3]]},
 cap:['Tx 1 writes but hasn\'t committed.','Without isolation, Tx 2 reads the uncommitted value: a <b>dirty read</b>.','Tx 1 rolls back. Tx 2 made decisions based on a value that never existed.','<b>Read committed</b> prevents dirty reads (readers see the last committed value) and dirty writes (row locks until commit). It is the Postgres default.']},
{sec:'Ch 7 · Transactions',t:'Read skew → snapshot isolation (MVCC)',k:'Repeatable read',
 seq:{a:['Alice (reading)|t','Account 1|b','Account 2|b','Transfer Tx|a'],m:[
  ['#','Account 1','Account 2','start: 500 + 500 = 1000','x',0],
  ['Alice (reading)','Account 1','SELECT → 500','',0],
  ['Transfer Tx','Account 1','+100 → 600','a',1],
  ['Transfer Tx','Account 2','−100 → 400 · COMMIT','a',1],
  ['Alice (reading)','Account 2','SELECT → 400','',2],
  ['#','Alice (reading)',null,'Alice sees 900. $100 vanished?','r',2],
  ['#','Alice (reading)','Account 2','Snapshot isolation: Alice\'s whole tx reads the snapshot from its start → 500 + 500','g',3]]},
 cap:['Alice reads account 1 (500) in the middle of a transfer.','The transfer commits between her two reads.','She reads account 2 after the commit: 500 + 400 = 900. This is <b>read skew</b>, and it breaks backups, analytics, and integrity checks.','<b>Snapshot isolation</b>: each transaction sees a consistent snapshot as of its start. It is implemented with <b>MVCC</b>: rows keep multiple versions tagged with created_by/deleted_by transaction IDs. Readers never block writers.'],
 cards:[['why','MVCC in one line','UPDATE = mark old version deleted by tx 13 + insert new version created by tx 13. Your snapshot ignores versions created after you started. VACUUM cleans up old versions later.']]},
{sec:'Ch 7 · Transactions',t:'Lost update: read-modify-write races',k:'Concurrent writes',
 seq:{a:['User A|t','Database|b','User B|p'],m:[
  ['User A','Database','SELECT likes → 42','',0],
  ['User B','Database','SELECT likes → 42','',0],
  ['User A','Database','UPDATE likes = 43','',1],
  ['User B','Database','UPDATE likes = 43','r',1],
  ['#','Database',null,'expected 44 → one update LOST','r',1],
  ['#','User A','User B','Fix 1: UPDATE likes = likes + 1 (atomic)','g',2],
  ['#','User A','User B','Fix 2: SELECT … FOR UPDATE (lock the row)','g',3],
  ['#','User A','User B','Fix 3: UPDATE … WHERE version = 7 (compare-and-set)','g',4]]},
 cap:['Both read the same value.','Both write value+1. The second write overwrites the first, so one like is lost.','<b>Atomic operations</b> are the best fix when possible: the DB does read+write as one step. Redis INCR works the same way.','<b>Pessimistic lock</b>: SELECT FOR UPDATE makes the second reader wait. Good under high contention.','<b>Optimistic (CAS)</b>: a version column; if 0 rows are updated, retry. Good under low contention. Postgres Repeatable Read also auto-detects lost updates and aborts.'],
 cards:[['say',null,'"For the auction, bids use a conditional write, UPDATE … SET max_bid=? WHERE max_bid &lt; ?, so concurrent bids can\'t overwrite each other."']]},
{sec:'Ch 7 · Transactions',t:'Write skew: the double-booking bug',k:'The anomaly that bites interviews',
 seq:{a:['Alice (doctor)|t','Database|b','Bob (doctor)|p'],m:[
  ['#','Database',null,'rule: at least 1 doctor on call','a',0],
  ['Alice (doctor)','Database','COUNT on-call → 2 ✓','',0],
  ['Bob (doctor)','Database','COUNT on-call → 2 ✓','',0],
  ['Alice (doctor)','Database','UPDATE alice off-call · COMMIT','',1],
  ['Bob (doctor)','Database','UPDATE bob off-call · COMMIT','',1],
  ['#','Database',null,'0 doctors on call ✗','r',1],
  ['#','Alice (doctor)','Bob (doctor)','Same shape: two users book the last room','r',2],
  ['#','Alice (doctor)','Bob (doctor)','Fix: SELECT … FOR UPDATE on the rows checked · or SERIALIZABLE','g',3]]},
 cap:['Both check a condition across rows and see it is safe.','Each updates a <b>different</b> row, so there is no write conflict and snapshot isolation allows both. The invariant is broken.','This is the pattern of every booking bug: "check availability, then insert booking". If the check finds no rows to lock, it is a <b>phantom</b>.','Fixes: lock the rows you checked; use SERIALIZABLE; add a unique constraint; or <b>materialize the conflict</b> by creating a row per seat or room-night so there is something to lock.'],
 cards:[['say',null,'"Each seat is a row with status AVAILABLE/HELD/SOLD. A hold is UPDATE seats SET status=HELD WHERE id=? AND status=AVAILABLE. If one row was updated I won it, if zero someone else did. No write skew possible."']]},
{sec:'Ch 7 · Transactions',t:'Isolation levels: what each prevents',k:'Cheat sheet',
 tbl:{h:['Anomaly','Read Committed','Snapshot / Repeatable Read','Serializable'],r:[
  ['Dirty read / write','✓ prevented','✓','✓'],
  ['Read skew (non-repeatable read)','✗','✓ prevented','✓'],
  ['Lost update','✗ (use atomic op / lock)','✓ Postgres detects; MySQL ✗','✓'],
  ['Write skew','✗','✗','✓ prevented'],
  ['Phantoms','✗','✗ (mostly)','✓ prevented'],
  ['Default in','Postgres, Oracle, SQL Server','MySQL InnoDB','CockroachDB, FoundationDB']]},
 cards:[['why','Serializable, three ways','<b>Actual serial execution</b>: one thread, stored procedures (VoltDB, Redis Lua). <b>2PL</b>: readers block writers and vice versa, with predicate locks; slow, deadlocks. <b>SSI</b>: optimistic; detect stale reads at commit and abort (Postgres SERIALIZABLE).']]},
{sec:'Ch 7 · Transactions',t:'Two-phase locking vs serializable snapshot isolation',k:'Serializability',
 d:{w:800,h:320,
  z:[[15,15,375,290,'2PL: pessimistic','r'],[410,15,375,290,'SSI: optimistic','g',1]],
  n:[['t1',110,80,'Tx 1 reads row','b'],['lk',300,80,'shared lock','a'],['t2',110,170,'Tx 2 wants write','p'],['wt',300,170,'BLOCKED\nuntil Tx 1 ends','r'],['dl',200,260,'risk: deadlocks · slow p99','r','pill'],
     ['s1',510,80,'Tx 1 reads (snapshot)','b',null,1],['s2',510,170,'Tx 2 writes · commits','p',null,1],['s3',690,125,'Tx 1 commits?\nDB: your read\nis stale → ABORT','g',null,1,150,80],['rt',600,260,'app retries · no blocking','g','pill',1]],
  e:[['t1','lk','','a',0],['t2','wt','','r',0],['s1','s3','','g',1],['s2','s3','','g',1]]},
 cap:['<b>2PL</b>: readers hold shared locks and writers need exclusive locks, both held until commit. Correct, but throughput drops and p99 latency is unpredictable under contention.','<b>SSI</b>: everyone runs on snapshots without blocking. At commit, the DB checks whether anything you read has since changed and, if so, aborts you. Fast at low contention. Under high contention there are many aborts, so retries are needed.']},
{sec:'Ch 7 · Transactions',t:'Interview angle: Chapter 7',k:'Chapter 7 → interview',
 c2:[['q',null,'"Two users book the last room at the same time."<br>→ Write skew. Use a row per room-night + <b>conditional UPDATE</b>, or SELECT FOR UPDATE, or a unique constraint on (room, date).'],
  ['q',null,'"Like counter at 50k/sec?"<br>→ Not row locks. Use atomic INCR in Redis, sharded counters, or batch into the DB asynchronously. The lost update is avoided because the increment is atomic.'],
  ['q',null,'"Optimistic or pessimistic?"<br>→ Low contention: optimistic version check. High contention on few rows (hot seat map): pessimistic lock or a queue to serialize.'],
  ['q',null,'"Transaction across 2 services?"<br>→ No distributed ACID. Use a <b>saga</b> with compensations plus the outbox pattern (Ch 9 and 12).']]},

/* ───────── CH 8 ───────── */
{sec:'Ch 8 · Trouble with Distributed Systems',type:'title',k:'Chapter 8',t:'The Trouble with Distributed Systems',
 s:'On one machine, things either work or crash. Across machines you get <b>partial failure</b>: some parts work, some don\'t, and you often can\'t tell which. The three villains are unreliable networks, unreliable clocks, and process pauses.',
 chips:['partial failure','timeouts','clock skew','LWW danger','GC pauses','leases','fencing tokens','majority quorum']},
{sec:'Ch 8 · Trouble with Distributed Systems',t:'The network: you cannot tell why there was no reply',k:'Unreliable networks',
 d:{w:800,h:330,
  n:[['a1',100,60,'Client','t','pill'],['b1',600,60,'Server','b'],
     ['a2',100,160,'Client','t','pill',1],['b2',600,160,'Server (crashed)','r','x',1],
     ['a3',100,260,'Client','t','pill',2],['b3',600,260,'Server','g',null,2],
     ['q',350,320,'From the client\'s side, all three look IDENTICAL: a timeout','a','pill',3]],
  e:[['a1','b1','request lost ✗','rd',0],['a2','b2','request','',1],['a3','b3','request ✓','g',2],['b3','a3','reply lost ✗','rdC',2]]},
 cap:['① The request was lost in the network (or is still queued in a switch).','② The request arrived, but the server crashed or is in a long GC pause.','③ The server <b>did the work</b>, but the reply was lost. A retry runs it twice.','The client only knows "no reply before the timeout". That is why every retried operation must be <b>idempotent</b>.'],
 cards:[['say',null,'"Payment calls to the provider can time out after the charge succeeded. Every request carries an idempotency key, so a retry is safe."'],
  ['num','Choosing a timeout','Too short means healthy nodes are declared dead and failover storms follow. Too long means users wait. Use p99.9 latency × margin, or adaptive (phi-accrual) detectors.']]},
{sec:'Ch 8 · Trouble with Distributed Systems',t:'Clocks: last-write-wins can drop the newer write',k:'Unreliable clocks',
 seq:{a:['Client A|t','Node 1 (clock +3ms fast)|r','Node 2 (accurate)|b','Client B|p'],m:[
  ['Client A','Node 1 (clock +3ms fast)','set x=1  ts=42.004','',0],
  ['Node 1 (clock +3ms fast)','Node 2 (accurate)','replicate x=1 @42.004','ad',0],
  ['Client B','Node 2 (accurate)','set x=2  ts=42.003  (really LATER)','',1],
  ['#','Node 2 (accurate)',null,'LWW: 42.004 > 42.003 → keep x=1','r',2],
  ['#','Client A','Client B','x=2 silently discarded ✗','r',2]]},
 cap:['Node 1\'s clock runs a few ms fast. Client A\'s write gets timestamp 42.004.','Client B writes later in real time, but Node 2\'s accurate clock says 42.003.','Last-write-wins compares timestamps, and the causally later write <b>loses</b>. No error is raised. NTP accuracy is only tens of ms at best.'],
 cards:[['why','Two kinds of clock','<b>Time-of-day</b> (System.currentTimeMillis) can jump backwards after an NTP sync. Never use it to measure durations. <b>Monotonic</b> (System.nanoTime) only moves forward and is for durations and timeouts.'],
  ['q',null,'Google Spanner uses <b>TrueTime</b>: clocks return an interval [earliest, latest], and a commit waits out the uncertainty (~7ms).']]},
{sec:'Ch 8 · Trouble with Distributed Systems',t:'Process pauses: the expired-lease bug',k:'GC pauses',
 seq:{a:['Client 1|t','Lock service|p','Storage|b','Client 2|a'],m:[
  ['Client 1','Lock service','acquire lease (10s)','',0],
  ['Lock service','Client 1','granted','g',0],
  ['#','Client 1',null,'stop-the-world GC: 15s','r',1],
  ['#','Lock service',null,'lease expires','a',2],
  ['Client 2','Lock service','acquire lease','',2],
  ['Lock service','Client 2','granted','g',2],
  ['Client 2','Storage','write file','',3],
  ['Client 1','Storage','write file (thinks it holds the lock!)','r',4],
  ['#','Storage',null,'CORRUPTED','r',4]]},
 cap:['Client 1 takes a lease, a lock with a timeout.','Then it pauses: a GC pause, VM migration, swapping, or a laptop lid closing. The thread doesn\'t know it paused.','The lease expires and is given to Client 2.','Client 2 writes, correctly.','Client 1 wakes up, checks nothing, and writes. Two writers think they own the lock.'],
 cards:[['trap','Checking the time does not help','"Check lease validity before writing" still races, because the pause can happen <b>between</b> the check and the write.']]},
{sec:'Ch 8 · Trouble with Distributed Systems',t:'Fencing tokens: the fix',k:'Fencing',
 seq:{a:['Client 1|t','Lock service|p','Storage|b','Client 2|a'],m:[
  ['Lock service','Client 1','lease + token 33','g',0],
  ['#','Client 1',null,'GC pause…','r',0],
  ['Lock service','Client 2','lease + token 34','g',1],
  ['Client 2','Storage','write (token 34) ✓','g',1],
  ['#','Storage',null,'highest seen = 34','b',1],
  ['Client 1','Storage','write (token 33)','r',2],
  ['Storage','Client 1','REJECTED: 33 < 34','r',2]]},
 cap:['Every lock grant comes with a <b>monotonically increasing token</b>. ZooKeeper\'s zxid or an etcd revision works.','The storage remembers the highest token it has seen.','A late writer with an old token is rejected. The protection is enforced by the <b>resource</b>, not trusted to the client.'],
 cards:[['say',null,'"A Redis lock alone isn\'t safe under GC pauses. I\'d pair the lock with a fencing token, for example a version column the DB checks: UPDATE … WHERE version &lt; :token."'],
  ['why','Truth = majority','A node can\'t trust its own view ("am I still leader?"). Decisions are made by a <b>quorum</b> of nodes, which is the basis of Ch 9.']]},
{sec:'Ch 8 · Trouble with Distributed Systems',t:'System models and Byzantine faults',k:'Assumptions',
 tbl:{h:['Model','Assumes','Reality'],r:[
  ['Timing: synchronous','Bounded network delay, pauses, clock drift','Not realistic'],
  ['Timing: partially synchronous','Usually bounded, sometimes not','<b>The realistic model</b>; algorithms must stay safe when bounds break'],
  ['Timing: asynchronous','No timing assumptions at all','Very restrictive; no timeouts'],
  ['Node: crash-stop','Crashed nodes never return','Simplifies proofs'],
  ['Node: crash-recovery','Nodes crash and return; disk survives, RAM doesn\'t','<b>Realistic</b> for datacenters'],
  ['Node: Byzantine','Nodes may lie or act maliciously','Blockchains, aerospace. Rarely needed inside one company.']]},
 cards:[['why','Safety vs liveness','<b>Safety</b>: nothing bad ever happens (no two leaders). This must always hold. <b>Liveness</b>: something good eventually happens (a leader gets elected). This may wait for the network to heal.']]},
{sec:'Ch 8 · Trouble with Distributed Systems',t:'Interview angle: Chapter 8',k:'Chapter 8 → interview',
 c2:[['q',null,'"What if the payment provider times out?"<br>→ Outcome unknown. Retry with the <b>same idempotency key</b>, or reconcile with a status query. Never blindly charge again.'],
  ['q',null,'"Distributed lock with Redis?"<br>→ Fine for efficiency (avoid duplicate work). For correctness add <b>fencing tokens</b>, or use the DB\'s own conditional writes.'],
  ['q',null,'"Order events by timestamp?"<br>→ Wall clocks skew. Use a sequence from one leader, a Kafka partition offset, or logical clocks (Ch 9).'],
  ['q',null,'"How do you detect a dead node?"<br>→ Heartbeats + timeouts tuned to p99.9, and accept false positives. Leader election by majority, with epochs to fence the old leader.']]},

/* ───────── CH 9 ───────── */
{sec:'Ch 9 · Consistency & Consensus',type:'title',k:'Chapter 9',t:'Consistency & Consensus',
 s:'Given everything in Ch 8, how do nodes <b>agree</b>? This chapter covers linearizability (behave like one copy), ordering and causality, distributed transactions (2PC), and consensus (Raft, Paxos, ZooKeeper), the tools behind leader election, locks, and uniqueness.',
 chips:['linearizability','CAP','causality','Lamport clocks','total order broadcast','2PC','Raft','ZooKeeper']},
{sec:'Ch 9 · Consistency & Consensus',t:'Linearizability: behave as if there is one copy',k:'Strongest single-object guarantee',
 seq:{a:['Referee|a','Leader|b','Follower (lagging)|r','Alice|t','Bob|p'],m:[
  ['Referee','Leader','score = FINAL 2–1','',0],
  ['Alice','Leader','read','',1],
  ['Leader','Alice','FINAL 2–1','g',1],
  ['#','Alice','Bob','Alice: "it\'s over!" Bob refreshes after hearing her','a',2],
  ['Bob','Follower (lagging)','read','',2],
  ['Follower (lagging)','Bob','still playing 1–1 ✗','r',2],
  ['#','Leader','Bob','Linearizable: once ANY reader sees the new value, all later reads must too','g',3]]},
 cap:['The final score is written to the leader.','Alice reads it.','Bob reads <b>after</b> Alice (he heard her shout), from a lagging replica, and sees an older value. That violates linearizability.','<b>Linearizability</b> means every operation appears to take effect atomically at one point in time, consistent with real-time order. It is a recency guarantee on a single object.'],
 cards:[['trap','Not the same as serializability','<b>Serializable</b> is about transactions over many objects (isolation, Ch 7). <b>Linearizable</b> is about recency of a single object. "Strict serializability" is both.']]},
{sec:'Ch 9 · Consistency & Consensus',t:'When you actually need linearizability',k:'Use cases',
 d:{w:800,h:330,
  n:[['l1',140,60,'Leader election / locks','a'],['l2',140,130,'Uniqueness constraints|username, seat #42, account balance ≥ 0','a',null,0,250],
     ['web',110,250,'Web server','b',null,1],['st',400,200,'File storage|(replicated)','g','db',1],['mq',400,300,'Queue','p','q',1],['rs',680,250,'Resizer','b',null,1]],
  e:[['web','st','1. upload full image','',1],['web','mq','2. "resize img 7"','p',1],['mq','rs','','p',1],['rs','st','3. fetch → OLD version? ✗','r',2]]},
 cap:['Leader election and locks need every node to agree on <b>one</b> holder, and uniqueness constraints need everyone to agree on who got there first. Both require linearizable storage.','<b>Cross-channel timing</b>: the web server stores an image, then sends a message through a different channel (the queue).','If the resizer reads a lagging storage replica, it resizes the old image. Two channels give a race. The fix is linearizable storage, or putting the version number in the message.'],
 cards:[['why','Everything else','Feeds, likes, view counts, search results: <b>eventual consistency is fine</b>. Saying this explicitly is a strong staff signal.']]},
{sec:'Ch 9 · Consistency & Consensus',t:'Which systems are linearizable, and CAP done right',k:'CAP · PACELC',
 tbl:{h:['Replication','Linearizable?','Why'],r:[
  ['Single-leader (reads from leader)','Potentially yes','If reads hit the leader and the leader is really the leader (fencing)'],
  ['Consensus (Raft / ZooKeeper / etcd)','Yes','Designed for it'],
  ['Multi-leader','No','Concurrent writes on different leaders'],
  ['Leaderless (Dynamo / Cassandra)','Probably not','LWW + clock skew, sloppy quorums, timing edge cases']]},
 cards:[['why','CAP, correctly stated','Network <b>partitions will happen</b>. When one does, choose: refuse some requests to stay consistent (<b>CP</b>), or answer from possibly stale data (<b>AP</b>). It is a decision per feature, not per database.'],
  ['num','PACELC','<b>E</b>lse, when there is no partition, you trade <b>L</b>atency vs <b>C</b>onsistency. Linearizability is slow even when nothing fails, because each operation waits for a quorum round trip.'],
  ['say',null,'"Inventory and payments are CP: I\'d rather reject than oversell. Hotel search and reviews are AP: stale by a few seconds is fine."']]},
{sec:'Ch 9 · Consistency & Consensus',t:'Ordering: Lamport timestamps',k:'Causality without clocks',
 seq:{a:['Node A|b','Node B|g','Node C|p'],m:[
  ['#','Node A',null,'counter=1 → write (1,A)','b',0],
  ['Node A','Node B','msg with (1,A)','',1],
  ['#','Node B',null,'max(0,1)+1 = 2 → write (2,B)','g',1],
  ['Node B','Node C','msg with (2,B)','',2],
  ['#','Node C',null,'max(0,2)+1 = 3 → write (3,C)','p',2],
  ['#','Node A','Node C','Order: compare counter, tie-break by node ID → a TOTAL order consistent with causality','a',3]]},
 cap:['Each node keeps a counter and tags every operation with (counter, nodeId).','On receiving a message, a node sets counter = max(own, received) + 1. Causality is carried along with the message.','So if A happened before C, then A\'s timestamp is smaller than C\'s.','The limit: the order is only known <b>after the fact</b>. To decide "username taken?" right now you must know nobody else is claiming it concurrently, which needs <b>total order broadcast</b>, which is consensus.'],
 cards:[['why','Total order broadcast','Deliver all messages to all nodes in the same order, reliably. This is exactly a <b>replicated log</b>: Kafka partitions (within a partition), Raft logs, ZooKeeper\'s zab.']]},
{sec:'Ch 9 · Consistency & Consensus',t:'Two-phase commit (2PC)',k:'Distributed atomic commit',
 seq:{a:['Coordinator|a','Payments DB|b','Bookings DB|g'],m:[
  ['Coordinator','Payments DB','PREPARE','',0],
  ['Coordinator','Bookings DB','PREPARE','',0],
  ['Payments DB','Coordinator','YES (promise to commit)','g',1],
  ['Bookings DB','Coordinator','YES','g',1],
  ['#','Coordinator',null,'write COMMIT decision to log','a',2],
  ['Coordinator','Payments DB','COMMIT','g',2],
  ['Coordinator','Bookings DB','COMMIT','g',2],
  ['#','Coordinator','Bookings DB','If coordinator dies after PREPARE → participants stuck "in doubt", holding locks','r',3]]},
 cap:['Phase 1: ask every participant "can you commit?"','A YES is a binding promise: the participant must be able to commit even after a crash, so it holds locks.','The coordinator logs its decision (the commit point), then tells everyone.','The weakness is that 2PC <b>blocks</b>. If the coordinator dies, participants hold locks until it recovers. This is why microservices use <b>sagas</b> instead.'],
 cards:[['say',null,'"I won\'t use 2PC across the payment and booking services. I\'ll use a saga: reserve room → charge → confirm, with compensations (release room, refund), driven by events with the outbox pattern."']]},
{sec:'Ch 9 · Consistency & Consensus',t:'Consensus: Raft in one picture',k:'Raft / Paxos / Zab',
 d:{w:800,h:340,
  n:[['L',400,70,'Leader (term 5)','a','db'],['f1',160,180,'Follower','b','db'],['f2',320,250,'Follower','b','db'],['f3',480,250,'Follower','b','db'],['f4',640,180,'Follower','b','db'],
     ['c',400,320,'entry committed once a MAJORITY (3/5) has it','g','pill',2]],
  e:[['L','f1','append','a',1],['L','f2','append','a',1],['L','f3','append','a',1],['L','f4','append','a',1],],
  t:[[680,60,'Leader dies →','r',3,12,'m',700],[680,78,'timeout → candidate,','r',3,11],[680,94,'term 6, needs majority','r',3,11],[680,110,'of votes → new leader','r',3,11]]},
 cap:['A cluster of 5 nodes (tolerates 2 failures). One elected leader per <b>term</b> (epoch).','The leader appends each command to its log and replicates it to followers.','An entry is <b>committed</b> once a majority store it. Any future majority overlaps this one, so committed entries are never lost.','If the leader goes silent, a follower times out, increments the term, and asks for votes. A majority makes it leader. A higher term <b>fences</b> the old leader.'],
 cards:[['num','Sizing','2f+1 nodes tolerate f failures: 3 nodes → 1, 5 nodes → 2. Every write needs a majority round trip, so consensus is used for <b>metadata</b>, not bulk data.']]},
{sec:'Ch 9 · Consistency & Consensus',t:'ZooKeeper / etcd: consensus as a service',k:'Coordination services',
 d:{w:800,h:320,
  n:[['zk',400,160,'ZooKeeper / etcd|3 or 5 nodes · Raft/Zab','p','db',0,190],
     ['u1',140,60,'Leader election|Kafka controller, HA scheduler','b',null,1,230],['u2',660,60,'Locks + fencing|zxid / revision = token','b',null,1,210],
     ['u3',140,270,'Service discovery|who is alive (ephemeral nodes)','b',null,2,240],['u4',660,270,'Config + partition map|shard → node, watched by routers','b',null,2,240]],
  e:[['u1','zk','','p2',1],['u2','zk','','p2',1],['u3','zk','','p2',2],['u4','zk','','p2',2]]},
 cap:['You almost never implement consensus yourself. You use a small, strongly consistent store.','Common uses: elect one active scheduler or controller; distributed locks with fencing tokens.','Membership via <b>ephemeral nodes</b> that vanish when a session dies; config and shard maps that clients <b>watch</b> for changes.'],
 cards:[['say',null,'"The job scheduler runs active-passive. Leader election goes through etcd with a lease, and the lease revision is the fencing token on job-claim writes."']]},
{sec:'Ch 9 · Consistency & Consensus',t:'Interview angle: Chapter 9',k:'Chapter 9 → interview',
 c2:[['q',null,'"Is this CP or AP?"<br>→ Answer <b>per feature</b>: booking and payment are CP, search and feeds are AP. Mention PACELC latency cost.'],
  ['q',null,'"Transaction spanning booking + payment services?"<br>→ Not 2PC (blocking, coupling). Use a <b>saga</b> + outbox + idempotent consumers.'],
  ['q',null,'"Exactly one scheduler must run."<br>→ Leader election via ZooKeeper or etcd (consensus), lease + fencing token.'],
  ['q',null,'"Unique usernames across regions?"<br>→ Needs linearizable compare-and-set: one strongly consistent store (Spanner, CockroachDB, or a single-leader region for usernames).']]}

/* ───────── CH 10 ───────── */
{sec:'Ch 10 · Batch Processing',type:'title',k:'Chapter 10 · Part III begins',t:'Batch Processing',
 s:'Take a big, bounded, <b>immutable</b> input, run a pure function over it, and produce a derived output. Because inputs are never modified, a buggy job is fixed by re-running it. That property, being able to recompute from source, runs through all of Part III.',
 chips:['Unix philosophy','MapReduce','HDFS','shuffle','sort-merge join','broadcast join','Spark DAG']},
{sec:'Ch 10 · Batch Processing',t:'The Unix philosophy: small tools, one interface',k:'Where batch comes from',
 flow:{w:800,h:130,gap:22,f:[['access.log','x','db'],['awk $7','b'],['sort','b',null,'',1],['uniq -c','b',null,'',1],['sort -rn','b',null,'',2],['head -5','g',null,'',2]]},
 cap:['Read the log and extract the URL field from each line.','Sort so identical URLs are adjacent, then count each run. When the data is bigger than memory, sort spills to disk, so this scales past RAM.','Sort by count and take the top 5. Six tiny programs, composed through one uniform interface: a stream of lines.'],
 pts:['<b>Immutable input</b>: run it as many times as you like and nothing breaks.','<b>Uniform interface</b>: every tool reads and writes files, so you can wire anything to anything.','<b>Separation of logic and wiring</b>: the program doesn\'t know where its input came from.','MapReduce is this same idea spread across thousands of machines, with HDFS as the "file".']},
{sec:'Ch 10 · Batch Processing',t:'MapReduce: map, shuffle, reduce',k:'Distributed batch',
 d:{w:800,h:340,
  n:[['i1',80,80,'HDFS block 1','b','db'],['i2',80,170,'HDFS block 2','b','db'],['i3',80,260,'HDFS block 3','b','db'],
     ['m1',260,80,'Mapper','a',null,1],['m2',260,170,'Mapper','a',null,1],['m3',260,260,'Mapper','a',null,1],
     ['sh',440,170,'SHUFFLE|partition by hash(key)\nsort by key','p',null,2,150,90],
     ['r1',620,110,'Reducer A|keys a–m','g',null,3],['r2',620,230,'Reducer B|keys n–z','g',null,3],
     ['o',740,170,'HDFS\noutput','b','db',3,80]],
  e:[['i1','m1','','',1],['i2','m2','','',1],['i3','m3','','',1],['m1','sh','(k,v)','a',2],['m2','sh','','a',2],['m3','sh','','a',2],['sh','r1','','p',3],['sh','r2','','p',3],['r1','o','','g',3],['r2','o','','g',3]]},
 cap:['Input is split into blocks, replicated across machines (HDFS).','The scheduler runs a <b>mapper</b> next to each block (move the compute to the data). Mappers emit key-value pairs.','The <b>shuffle</b> sends every pair with the same key to the same reducer and sorts them. This is the expensive network step.','Each <b>reducer</b> sees all values for its keys together, aggregates them, and writes output files. If a task fails, just rerun that task, because inputs are immutable.'],
 cards:[['num','Scale','Mapper output goes to local disk; reducers pull over the network. Jobs at Google and Yahoo processed petabytes daily, and the same pattern now runs in Spark, BigQuery, and Snowflake.']]},
{sec:'Ch 10 · Batch Processing',t:'Joins in batch: bring related records together',k:'Sort-merge · broadcast · partitioned',
 d:{w:800,h:330,
  n:[['ev',110,80,'Click events|(user_id, url)','b','db'],['us',110,240,'User DB snapshot|(user_id, birth_year)','b','db'],
     ['m1',330,80,'Mapper: key=user_id','a'],['m2',330,240,'Mapper: key=user_id','a'],
     ['r',580,160,'Reducer for user 104|profile first, then all clicks\n→ (url, age) pairs','g',null,1,230,80],
     ['bc',580,295,'Small table? BROADCAST it to every mapper (in-memory hash)','p','pill',2]],
  e:[['ev','m1','','',0],['us','m2','','',0],['m1','r','','a',1],['m2','r','','a',1]]},
 cap:['Goal: "which URLs are popular with which age group?" Don\'t query the user DB per event (millions of random lookups). Take a <b>snapshot</b> of it.','<b>Sort-merge join</b>: both mappers emit user_id as the key. The shuffle delivers one user\'s profile and clicks to the same reducer, adjacent. One linear pass joins them.','<b>Broadcast hash join</b>: if one side is small (a hotel dimension table), load it into each mapper\'s memory. No shuffle is needed. <b>Partitioned hash join</b>: both sides partitioned the same way, so join partition by partition.'],
 cards:[['trap','Skew','One hot key (a celebrity user) sends millions of records to one reducer. Fixes: skewed-join handling (sample hot keys, spread them across reducers), the same idea as Ch 6.']]},
{sec:'Ch 10 · Batch Processing',t:'Beyond MapReduce: dataflow engines and batch outputs',k:'Spark · Flink · outputs',
 d:{w:800,h:320,
  z:[[15,15,770,130,'MapReduce: every stage writes to HDFS (3× replicated)','r'],[15,170,770,135,'Spark / Flink: one DAG, intermediate state in memory','g',1]],
  n:[['a1',110,80,'Job 1','a'],['h1',260,80,'HDFS','r','db'],['a2',410,80,'Job 2','a'],['h2',560,80,'HDFS','r','db'],['a3',700,80,'Job 3','a'],
     ['s1',110,240,'stage 1','g',null,1],['s2',330,240,'stage 2','g',null,1],['s3',550,240,'stage 3','g',null,1],['o',710,240,'output','b','db',1]],
  e:[['a1','h1','','r'],['h1','a2','','r'],['a2','h2','','r'],['h2','a3','','r'],['s1','s2','memory / local','g',1],['s2','s3','','g',1],['s3','o','','g',1]]},
 cap:['Chaining MapReduce jobs <b>materializes</b> every intermediate result to replicated HDFS: slow, and each job waits for the whole previous one.','Dataflow engines run the whole workflow as one <b>DAG</b> and pipeline data between operators. On failure they recompute lost partitions from <b>lineage</b>, so typically 10–100× faster.'],
 cards:[['why','What batch jobs produce','Search indexes (build offline, swap atomically), pre-computed recommendations, ML features, read-only KV stores bulk-loaded into serving. A bad output is rolled back by pointing at yesterday\'s files.']]},
{sec:'Ch 10 · Batch Processing',t:'Interview angle: Chapter 10',k:'Chapter 10 → interview',
 c2:[['q',null,'"Web crawler for 10B pages?"<br>→ The frontier queue feeds fetchers. Text extraction and dedup run as batch (Spark) over S3. Re-runnable because raw pages are stored immutably.'],
  ['q',null,'"Daily top-K or reconciliation reports?"<br>→ Nightly batch over the event log in S3 or the warehouse. The streaming path gives fast approximate results and batch gives exact ones (Ch 12, Lambda).'],
  ['q',null,'"How do you rebuild the search index?"<br>→ Batch-build a new index from the source of truth, then atomically switch the alias. Old index kept for rollback.'],

  e:[['pr','p0','hash(key) % 3','',0],['pr','p1','','',0],['pr','p2','','',0],['p0','c1','','g',1],['p1','c2','','g',1],['p2','c2','','g',1],['p2','an','independent','pd',2]]},
 cap:['A topic is split into <b>partitions</b>, each an append-only log. The producer picks a partition by hashing the key, so all events for one booking land in one partition, in order.','Within a <b>consumer group</b>, each partition is read by exactly one consumer, so maximum parallelism equals the partition count. Consumers commit their <b>offset</b>; after a crash they resume from it.','Another group reads the same data independently with its own offsets. Adding consumers doesn\'t cost the producer anything.'],
 cards:[['num','Numbers','~5–10k msg/sec per partition is a comfortable planning number; a broker handles ~1M msg/sec. Default retention is 7 days. Choose partitions = target throughput ÷ per-consumer throughput.']]},
{sec:'Ch 11 · Stream Processing',t:'The dual-write problem',k:'Why not just write to both?',
 seq:{a:['Client 1|t','Database|b','Search index|a','Client 2|p'],m:[
  ['Client 1','Database','set price = 100','',0],
  ['Client 2','Database','set price = 120','',0],
  ['Client 2','Search index','set price = 120','',1],
  ['Client 1','Search index','set price = 100','r',1],
  ['#','Database','Search index','DB says 120, search says 100: permanently inconsistent','r',2],
  ['#','Client 1','Client 2','+ if the 2nd write fails, the two systems also disagree','r',3]]},
 cap:['Two clients update the same item, and the DB applies them in one order.','The search index receives them in a different order (the network reorders them).','The two systems now disagree <b>permanently</b>, and nothing will repair it.','And if the app crashes between the two writes, one system has the change and the other doesn\'t. Writing to two systems is never atomic.'],
 cards:[['say',null,'"I won\'t dual-write to Postgres and Elasticsearch. I\'ll write only to Postgres and stream changes to Elasticsearch with CDC, so one order, defined by the DB log, reaches every consumer."']]},
{sec:'Ch 11 · Stream Processing',t:'Change data capture (CDC) and the outbox pattern',k:'One source of truth → many views',
 d:{w:800,h:375,
  d_:0,n:[['app',90,90,'App','t','pill'],['db',280,90,'Postgres|orders + outbox (1 tx)','b','db',null,190],
     ['wal',280,220,'WAL / binlog','b','q',1],['dz',470,220,'Debezium|CDC connector','p',null,1],['k',650,220,'Kafka','a','q',1],
     ['es',700,70,'Elasticsearch','g','db',2],['rc',560,330,'Redis cache','g','db',2],['dw',740,330,'Warehouse','g','db',2]],
  e:[['app','db','INSERT order\n+ INSERT outbox','',0],['db','wal','','',1],['wal','dz','tail','p',1],['dz','k','','p',1],['k','es','','g',2],['k','rc','','g',2],['k','dw','','g',2]]},
 cap:['<b>Outbox</b>: in the <b>same transaction</b> as the business write, insert an event row into an outbox table. Either both commit or neither does, so there is no dual-write problem.','A CDC connector tails the database\'s replication log (Ch 5) and publishes each change, including the outbox rows, to Kafka in commit order.','Every derived system (search, cache, warehouse) consumes the log and updates itself. Each can be rebuilt by replaying from offset 0, or from a snapshot plus the log.'],
 cards:[['why','Consumers must be idempotent','The relay can publish an event twice (crash after publish, before marking sent). Consumers dedupe by event ID or use upserts.']]},
{sec:'Ch 11 · Stream Processing',t:'Event sourcing: store what happened, derive the state',k:'Events as the source of truth',
 d:{w:800,h:300,
  n:[['e1',90,80,'RoomHeld|seat 12A','b'],['e2',240,80,'PaymentTaken|$120','b'],['e3',390,80,'HoldExtended|+5 min','b'],['e4',540,80,'BookingConfirmed','b'],['e5',690,80,'BookingCancelled','r',null,1],
     ['s1',220,230,'Current state view|status = CANCELLED','g','db',2,170],['s2',540,230,'Audit / analytics view|all history kept','g','db',2,190]],
  e:[['e1','e2','','n'],['e2','e3','','n'],['e3','e4','','n'],['e4','e5','','n',1],['e4','s1','fold events','gd',2],['e5','s2','replay','gd',2]]},
 cap:['Instead of updating a row in place, append immutable <b>events</b> that describe what the user did.','A cancellation is a new event, not a deletion. History is never lost.','State is a <b>derived view</b>, a fold over the events. You can build new views later by replaying, and debug by replaying to any point in time.'],
 cards:[['trap','Costs','Replay gets slow, so you need snapshots. Schema evolution of old events is hard (Ch 4). "Delete my data" (GDPR) conflicts with immutability. Use it for audit-heavy domains (payments, ledgers), not everywhere.'],
  ['why','CDC vs event sourcing','CDC derives events from DB row changes (low level). Event sourcing makes app-level events the truth (high level, intent preserved).']]},

 cap:['<b>Tumbling</b>: "clicks per minute". Each event belongs to exactly one window.','<b>Hopping</b>: a 5-minute average updated every minute. Windows overlap, so each event belongs to several.','<b>Sliding</b>: "two failed logins within 5 minutes of each other". The window is defined by the events themselves.','<b>Session</b>: group a user\'s activity until a gap, as in web analytics and Strava activities.'],
 cards:[['trap','Event time ≠ processing time','A phone offline in a tunnel sends events 10 minutes late. Bucket by <b>event time</b> (when it happened), not arrival time. A <b>watermark</b> says "probably all events up to T have arrived"; later stragglers are dropped or used to correct the result.']]},
{sec:'Ch 11 · Stream Processing',t:'Stream joins',k:'Three kinds',
 tbl:{h:['Join','Example','How'],r:[
  ['Stream–stream (window join)','Search event + click event within 1 hour → click-through rate','Buffer both streams in state, indexed by session ID, for the window length'],
  ['Stream–table (enrichment)','Click event + user profile → add country and age','Keep a <b>local copy</b> of the table in the processor, updated by CDC. No remote DB call per event.'],

 d:{w:800,h:320,

     ['op2','out','','g',2]],

 cap:['A failure mid-stream means some events were processed but their results weren\'t saved, or vice versa.','<b>Checkpointing</b> (Flink): barriers flow through the data. Each operator snapshots its state and the source offsets together. On failure, restore the snapshot and replay from those offsets. Spark does the same with <b>micro-batches</b>.','Replay means some outputs are sent twice. Make the sink <b>idempotent</b> (upsert by key, dedupe by event ID) or <b>transactional</b> (Kafka transactions commit offsets + outputs atomically). Duplicates still happen; they just have no effect.'],
 cards:[['say',null,'"Flink checkpoints every 10s. The sink upserts (ad_id, minute) → count, so replays after a failure overwrite instead of double-counting."']]},
{sec:'Ch 11 · Stream Processing',t:'Interview angle: Chapter 11',k:'Chapter 11 → interview',
 c2:[['q',null,'"Ad click aggregation at 10k/sec?"<br>→ Kafka partitioned by ad_id → Flink 1-min tumbling windows on event time → OLAP store. Raw clicks to S3 for batch reconciliation.'],
  ['q',null,'"Keep search, cache, and DB in sync?"<br>→ CDC (Debezium) or outbox → Kafka → idempotent consumers. Never dual-write.'],
  ['q',null,'"Kafka or SQS?"<br>→ Ordering, replay, or many consumers → Kafka. Independent tasks with per-message retry and DLQ → SQS.'],
  ['q',null,'"Exactly-once?"<br>→ "At-least-once delivery plus idempotent processing equals effectively-once. I make the consumer idempotent with an event ID."']]},

/* ───────── CH 12 ───────── */
{sec:'Ch 12 · The Future of Data Systems',type:'title',k:'Chapter 12',t:'The Future of Data Systems',
 s:'The book\'s conclusion: there is no one database that does everything. Build systems as a <b>source of truth plus derived views</b> connected by logs. Push correctness to the ends with idempotency, and separate "eventually up to date" (timeliness) from "never wrong" (integrity).',
 chips:['derived data','unbundling the DB','Lambda vs Kappa','end-to-end argument','idempotency keys','timeliness vs integrity','audit']},
{sec:'Ch 12 · The Future of Data Systems',t:'Unbundling the database',k:'Data integration',
 d:{w:800,h:340,
  n:[['app',90,170,'Application\nwrites','t','pill'],['sor',260,170,'System of record|Postgres','b','db'],['log',450,170,'Ordered log|Kafka / CDC','a','q',null,140,60],
     ['v1',680,50,'Cache|Redis','g','db',1],['v2',680,130,'Search|Elasticsearch','g','db',1],['v3',680,210,'Analytics|ClickHouse / BigQuery','g','db',1,180],['v4',680,290,'ML features / recs','g','db',1,170]],
  e:[['app','sor','','',0],['sor','log','','a',0],['log','v1','','g',1],['log','v2','','g',1],['log','v3','','g',1],['log','v4','','g',1]]},
 cap:['One <b>system of record</b> accepts writes. Its change log is the single ordered history of what happened.','Every other store is a <b>derived view</b>, like an index or materialized view, except in separate specialized systems. Any view can be dropped and rebuilt by replaying the log. Inside one database these are "indexes"; across a company they are "unbundled" into Kafka plus separate stores.'],
 cards:[['say',null,'"Postgres is the source of truth for bookings. Search, the cache, and analytics are derived views fed from CDC, so they are eventually consistent and rebuildable."']]},
{sec:'Ch 12 · The Future of Data Systems',t:'Lambda vs Kappa architecture',k:'Batch + stream',
 d:{w:800,h:330,
  z:[[15,15,770,150,'Lambda: two code paths','a'],[15,180,770,140,'Kappa: one stream path, reprocess by replay','g',1]],
  n:[['e',90,90,'Events','t','q'],['b',330,60,'Batch layer|exact, hours late','b'],['s',330,125,'Speed layer|approx, seconds','a'],['m',580,90,'Serving: merge','p'],
     ['e2',90,250,'Kafka log|long retention','t','q',1,130],['s2',330,250,'Stream job v1 → v2','g',null,1,160],['m2',580,250,'Serving table','p','db',1]],
  e:[['e','b','','b'],['e','s','','a'],['b','m','','b'],['s','m','','a'],['e2','s2','replay from 0\nfor v2','g',1],['s2','m2','','g',1]]},
 cap:['<b>Lambda</b>: a fast approximate stream path plus a slow exact batch path, merged at query time. Correct, but the same logic is written twice in two frameworks.','<b>Kappa</b>: one streaming codebase. To fix a bug or change logic, start v2 reading the log from the beginning, let it catch up, and switch reads over. This needs long log retention, such as Kafka tiered storage.'],
 cards:[['why','In interviews','Top-K and ad clicks often still use a Lambda-like design: Flink for real-time dashboards, nightly batch reconciliation for billing accuracy. Say why: <b>money needs exact numbers</b>.']]},
{sec:'Ch 12 · The Future of Data Systems',t:'The end-to-end argument: idempotency keys',k:'Correctness at the edges',
 seq:{a:['Mobile app|t','API|b','Payments DB|g'],m:[
  ['#','Mobile app',null,'generate request_id = uuid-7f3','a',0],
  ['Mobile app','API','POST /pay  Idempotency-Key: 7f3','',0],
  ['API','Payments DB','INSERT … (request_id UNIQUE)','g',1],
  ['API','Mobile app','200 OK (lost in network ✗)','rd',1],
  ['Mobile app','API','retry, same key 7f3','',2],
  ['API','Payments DB','INSERT → unique violation','a',2],
  ['API','Mobile app','return the stored original result','g',3]]},
 cap:['The <b>client</b> generates a unique ID for the operation, once, before the first attempt.','The server records it with a unique constraint in the same transaction as the effect.','The response is lost and the client retries. TCP, load-balancer, and DB-level dedup can\'t catch this, because it is a new connection and a new request.','The duplicate hits the unique constraint, and the server returns the original result. Only an <b>end-to-end</b> ID from the origin catches every duplicate.'],
 cards:[['say',null,'"Every mutating API takes an Idempotency-Key from the client. It is stored with a unique index, results are cached for 24h, and retries are always safe."']]},
{sec:'Ch 12 · The Future of Data Systems',t:'Timeliness vs integrity',k:'Two kinds of "consistency"',
 tbl:{h:['','Timeliness','Integrity'],r:[
  ['Means','Users see an up-to-date state','No corruption: no lost or double money, no contradictions'],
  ['If violated','Temporary and self-healing: "wait and refresh"','<b>Permanent</b>: needs manual repair'],
  ['Example','Booking shows in "My trips" 2s late','Room sold twice; card charged twice'],
  ['Mechanism','Read-your-writes, sync replication','Idempotency, unique constraints, atomic log append, reconciliation'],
  ['Can relax?','Often yes (eventual consistency)','Almost never']]},
 cards:[['why','Apologize vs prevent','Airlines overbook on purpose and compensate later. Some constraints can be checked <b>asynchronously</b> with a compensating action. Decide per invariant how much a violation costs.'],
  ['why','Trust, but verify','Run <b>reconciliation and audit</b> jobs that recompute derived data from source and compare (ledger sums, inventory counts). Bugs and bit-rot happen; detect them.']]},
{sec:'Ch 12 · The Future of Data Systems',t:'Interview angle: Chapter 12',k:'Chapter 12 → interview',
 c2:[['q',null,'"How do you guarantee no double charge?"<br>→ Client idempotency key + unique constraint + the payment provider\'s idempotency + a daily reconciliation job against provider settlement files.'],
  ['q',null,'"Search shows a stale price."<br>→ "Search is a derived view. Timeliness can lag seconds; the <b>checkout price is read from the source of truth</b> (integrity)."'],
  ['q',null,'"How would you change the aggregation logic?"<br>→ Kappa: deploy v2 consumer from offset 0 to a new table, compare, switch.'],
  ['say',null,'"I separate integrity from timeliness: money and inventory are strongly consistent and audited; everything the user browses is a derived, eventually consistent view."']]},
