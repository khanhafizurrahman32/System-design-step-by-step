<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Design: Interview Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#30363d;--border2:#484f58;
  --text:#cdd9e5;--text2:#adbac7;--text3:#768390;
  --amber:#f0a429;--green:#57ab5a;--blue:#6cb6ff;--purple:#dcbdfb;
  --red:#f47067;--teal:#39c5cf;--pink:#fc8dc7;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
a{color:var(--blue)}
.top{height:46px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px}
.brand{font-weight:800;font-size:13px;white-space:nowrap}
.brand b{color:var(--accent,var(--amber))}
.secsel{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:12px;padding:5px 8px;max-width:260px;font-family:var(--sans)}
.links{display:flex;gap:6px;margin-left:auto;overflow-x:auto}
.links a,.tbtn{font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 9px;border-radius:5px;text-decoration:none;background:var(--bg3);color:var(--text2);border:1px solid var(--border);white-space:nowrap;cursor:pointer}
.links a:hover,.tbtn:hover{border-color:var(--border2);color:var(--text)}
.links a.cur{color:var(--accent,var(--amber));border-color:var(--accent,var(--amber))}
.prog{height:3px;background:var(--bg3)}
.prog div{height:100%;background:var(--accent,var(--amber));transition:width .25s}
.stage{position:absolute;top:49px;bottom:52px;left:0;right:0;overflow-y:auto;padding:22px 28px}
.slide{max-width:1180px;margin:0 auto;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent,var(--amber));margin-bottom:6px}
.slide h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;line-height:1.2}
.slide .sub{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:16px;max-width:900px}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid.full{grid-template-columns:1fr}
.dbox{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px}
.dbox svg{width:100%;height:auto;display:block}
.cap{font-size:13px;color:var(--text);background:var(--bg3);border-left:3px solid var(--accent,var(--amber));border-radius:0 6px 6px 0;padding:8px 12px;margin-top:10px;line-height:1.55;min-height:38px}
.cap .sn{font-family:var(--mono);font-size:10px;color:var(--accent,var(--amber));margin-right:6px}
.side{display:flex;flex-direction:column;gap:10px}
.pts{list-style:none;display:flex;flex-direction:column;gap:7px}
.pts li{font-size:13.5px;line-height:1.55;color:var(--text2);padding-left:16px;position:relative}
.pts li:before{content:'';position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:2px;background:var(--accent,var(--amber))}
.pts li b,.card b{color:var(--text)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 13px;font-size:13px;line-height:1.55;color:var(--text2)}
.card .lab{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.c-say{border-color:rgba(87,171,90,.4);background:rgba(87,171,90,.06)} .c-say .lab{color:var(--green)}
.c-trap{border-color:rgba(244,112,103,.4);background:rgba(244,112,103,.06)} .c-trap .lab{color:var(--red)}
.c-num{border-color:rgba(108,182,255,.4);background:rgba(108,182,255,.06)} .c-num .lab{color:var(--blue)}
.c-why{border-color:rgba(240,164,41,.4);background:rgba(240,164,41,.06)} .c-why .lab{color:var(--amber)}
.c-q{border-color:rgba(220,189,251,.4);background:rgba(220,189,251,.06)} .c-q .lab{color:var(--purple)}
.c-say .body{color:var(--text);font-style:italic}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
table.t th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--bg3);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border2)}
table.t td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top;line-height:1.45}
table.t td:first-child{color:var(--text);font-weight:600}
table.t tr:last-child td{border-bottom:none}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cards3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.title-slide{min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.title-slide h1{font-size:40px}
.title-slide .sub{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.script{counter-reset:s;display:flex;flex-direction:column;gap:6px}
.script div{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--text2);display:flex;gap:10px}
.script div span.tm{font-family:var(--mono);font-size:11px;color:var(--accent,var(--amber));min-width:64px;font-weight:700}
.script div b{color:var(--text)}
.bot{position:absolute;bottom:0;left:0;right:0;height:52px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px}
.nbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.nbtn:hover{border-color:var(--accent,var(--amber))}
.nbtn.pri{background:var(--accent,var(--amber));color:#111;border-color:transparent}
.ctr{font-family:var(--mono);font-size:11px;color:var(--text3)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--border2);display:block}
.dots i.on{background:var(--accent,var(--amber))}
.hint{font-size:11px;color:var(--text3);margin-left:auto}
.ov{position:fixed;inset:0;background:rgba(13,17,23,.97);z-index:50;overflow-y:auto;padding:24px;display:none}
.ov.show{display:block}
.ov h2{font-size:18px;margin-bottom:12px}
.ov .sec{margin-bottom:18px}
.ov .sec h3{font-family:var(--mono);font-size:11px;color:var(--accent,var(--amber));text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.ov .its{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.ov .it{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer;color:var(--text2)}
.ov .it:hover{border-color:var(--accent,var(--amber));color:var(--text)}
.ov .it.cur{border-color:var(--accent,var(--amber))}
.ov .it span{font-family:var(--mono);font-size:10px;color:var(--text3);margin-right:6px}
/* svg */
.nd text{font-family:var(--sans);font-size:13px;font-weight:600}
.nd .sb{font-size:10.5px;font-weight:400;opacity:.8}
.el{transition:opacity .3s}
.el.new{animation:pop .45s}
@keyframes pop{0%{opacity:0}100%{opacity:1}}
.el.dim{opacity:.32}
.elab{font-family:var(--mono);font-size:10.5px}
.ztxt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.ftxt{font-family:var(--sans)}
@media (max-width:820px){
  .grid,.cards2,.cards3{grid-template-columns:1fr}
  .stage{padding:14px 14px}
  .slide h1{font-size:21px}
  .title-slide h1{font-size:28px}
  .brand{display:none}
  .hint{display:none}
  .secsel{max-width:150px}
}

.grid.full .dbox svg{max-width:880px;margin:0 auto}

.qa{display:flex;flex-direction:column;gap:8px}
.qi{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 13px}
.qi.open{border-color:rgba(87,171,90,.45)}
.qq{font-size:14px;font-weight:700;color:var(--text);display:flex;gap:8px}
.qq span{font-family:var(--mono);font-size:11px;color:var(--accent,var(--amber));padding-top:2px}
.qn{font-size:13px;color:var(--text2);line-height:1.55;margin-top:5px;padding-left:28px}
.qn i{color:var(--text3)}
.lst{margin:2px 0 0 16px}.lst li{margin-bottom:2px}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--teal)}
</style></head><body>
<script>/* Deck engine: slides + step reveal + SVG diagrams (free graph, sequence, flow) */
(function(){
const COL={b:'#6cb6ff',g:'#57ab5a',a:'#f0a429',p:'#dcbdfb',r:'#f47067',t:'#39c5cf',x:'#9aa4b2',k:'#fc8dc7',w:'#cdd9e5'};
const col=c=>COL[c]||c||COL.x;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let uid=0;

function s0(s){return Array.isArray(s)?s[0]:(s||0)}
function vis(s,cur){return Array.isArray(s)?(s[0]<=cur&&cur<=s[1]):(s||0)<=cur}
function cls(s,cur){return 'el'+(s0(s)===cur&&cur>0?' new':'')}

function markers(id){
  return '<defs>'+Object.keys(COL).map(k=>`<marker id="m${id}${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${COL[k]}"/></marker>`).join('')+'</defs>';
}

function nodeSize(n){
  const lines=String(n[3]).split('\n');
  let mx=0;lines.forEach(l=>{const [m,s]=l.split('|');mx=Math.max(mx,(m||'').length*7.3,(s||'').length*6.1)});
  const subs=lines.filter(l=>l.includes('|')).length;
  const w=n[7]||Math.max(70,mx+26);
  const h=n[8]||(24+lines.length*16+subs*13);
  return [w,h];
}

function drawNode(n,cur,o){
  const [id,x,y,label,c,shape,step]=n; if(!vis(step,cur))return '';
  const [w,h]=nodeSize(n); const C=col(c); const X=x-w/2,Y=y-h/2;
  let g=`<g class="nd ${cls(step,cur)}">`;
  const fill=`fill="${C}" fill-opacity="0.13" stroke="${C}" stroke-width="1.6"`;
  if(shape==='db'){
    const e=7;
    g+=`<path d="M${X},${Y+e} L${X},${Y+h-e} A${w/2},${e} 0 0 0 ${X+w},${Y+h-e} L${X+w},${Y+e} A${w/2},${e} 0 0 0 ${X},${Y+e} Z" ${fill}/><ellipse cx="${x}" cy="${Y+e}" rx="${w/2}" ry="${e}" fill="${C}" fill-opacity="0.25" stroke="${C}" stroke-width="1.6"/>`;
  }else if(shape==='q'){
    g+=`<rect x="${X}" y="${Y}" width="${w}" height="${h}" rx="5" ${fill}/>`;
    for(let i=1;i<=3;i++)g+=`<line x1="${X+w-6*i}" y1="${Y+4}" x2="${X+w-6*i}" y2="${Y+h-4}" stroke="${C}" stroke-opacity=".5"/>`;
  }else if(shape==='pill'){
    g+=`<rect x="${X}" y="${Y}" width="${w}" height="${h}" rx="${h/2}" ${fill}/>`;
  }else if(shape==='o'){
    g+=`<ellipse cx="${x}" cy="${y}" rx="${w/2}" ry="${h/2}" fill="none" stroke="${C}" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 5"/>`;
  }else if(shape==='n'){
    g+=`<rect x="${X}" y="${Y}" width="${w}" height="${h}" rx="6" fill="${C}" fill-opacity="0.05" stroke="${C}" stroke-dasharray="4 3"/>`;
  }else if(shape==='x'){
    g+=`<rect x="${X}" y="${Y}" width="${w}" height="${h}" rx="8" ${fill}/><line x1="${X+4}" y1="${Y+4}" x2="${X+w-4}" y2="${Y+h-4}" stroke="${COL.r}" stroke-opacity=".45" stroke-width="2"/><line x1="${X+w-4}" y1="${Y+4}" x2="${X+4}" y2="${Y+h-4}" stroke="${COL.r}" stroke-opacity=".45" stroke-width="2"/>`;
  }else{
    g+=`<rect x="${X}" y="${Y}" width="${w}" height="${h}" rx="8" ${fill}/>`;
  }
  const lines=String(label).split('\n');
  const total=lines.reduce((a,l)=>a+(l.includes('|')?29:16),0);
  let ty=y-total/2+12+(shape==='db'?4:0);
  lines.forEach(l=>{const [m,s]=l.split('|');
    g+=`<text x="${x}" y="${ty}" text-anchor="middle" fill="${shape==='x'?COL.r:'#e6edf3'}">${esc(m)}</text>`;
    if(s!==undefined){ty+=13;g+=`<text class="sb" x="${x}" y="${ty}" text-anchor="middle" fill="${C}">${esc(s)}</text>`}
    ty+=16;});
  return g+'</g>';
}

function clip(cx,cy,w,h,dx,dy,pad){
  if(!w)return [cx,cy];
  const hw=w/2+pad,hh=h/2+pad;
  const t=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9);
  return [cx+dx*t,cy+dy*t];
}

function drawEdge(e,nodes,cur,mid){
  const [f,to,label,st,step]=e; if(!vis(step,cur))return '';
  const s=st||'';
  const A=Array.isArray(f)?{x:f[0],y:f[1],w:0,h:0}:nodes[f], B=Array.isArray(to)?{x:to[0],y:to[1],w:0,h:0}:nodes[to];
  if(!A||!B)return '';
  const ck=(s.match(/[rgabptkx]/)||['x'])[0];
  const C=COL[ck];
  let curve=0; if(s.includes('c'))curve=-1; if(s.includes('C'))curve=1;
  const dxx=B.x-A.x,dyy=B.y-A.y,len=Math.hypot(dxx,dyy)||1;
  let cxp=(A.x+B.x)/2,cyp=(A.y+B.y)/2;
  const bend=s.includes('cc')||s.includes('CC')?95:48;
  if(curve){cxp+=-dyy/len*bend*curve;cyp+=dxx/len*bend*curve}
  const [x1,y1]=clip(A.x,A.y,A.w,A.h,(curve?cxp:B.x)-A.x,(curve?cyp:B.y)-A.y,3);
  const [x2,y2]=clip(B.x,B.y,B.w,B.h,(curve?cxp:A.x)-B.x,(curve?cyp:A.y)-B.y,4);
  const dash=s.includes('d')?' stroke-dasharray="6 4"':'';
  const mk=s.includes('n')?'':` marker-end="url(#m${mid}${ck})"`;
  const ms=s.includes('2')?` marker-start="url(#m${mid}${ck})"`:'';
  let path=curve?`M${x1},${y1} Q${cxp},${cyp} ${x2},${y2}`:`M${x1},${y1} L${x2},${y2}`;
  let g=`<g class="${cls(step,cur)}"><path d="${path}" fill="none" stroke="${C}" stroke-width="1.7"${dash}${mk}${ms}/>`;
  if(label){
    let lx=curve?(x1+2*cxp+x2)/4:(x1+x2)/2, ly=curve?(y1+2*cyp+y2)/4:(y1+y2)/2;
    const L=String(label).split('\n');const lw=Math.max(...L.map(l=>l.length))*6.4+10, lh=L.length*13+4;
    const seg=Math.hypot(x2-x1,y2-y1);
    if(!curve&&seg<lw+14){const ux=(x2-x1)/(seg||1),uy=(y2-y1)/(seg||1);let px=-uy,py=ux;if(py>0||(py===0&&px>0)){px=-px;py=-py}
      const off=Math.abs(ux)>Math.abs(uy)?lh/2+5:lw/2+6;lx+=px*off;ly+=py*off;}
    g+=`<rect x="${lx-lw/2}" y="${ly-lh/2}" width="${lw}" height="${lh}" rx="4" fill="#161b22" fill-opacity=".92"/>`;
    L.forEach((l,i)=>g+=`<text class="elab" x="${lx}" y="${ly-lh/2+12+i*13}" text-anchor="middle" fill="${s.match(/[rgabptk]/)?C:'#adbac7'}">${esc(l)}</text>`);
  }
  return g+'</g>';
}

function normD(d){if(d._n)return d;(d.n||[]).forEach(n=>{if(typeof n[5]==='number'||Array.isArray(n[5]))n.splice(5,0,null);if(typeof n[6]==='number'&&n[6]>=20)n.splice(6,0,null)});d._n=1;return d}
function drawFree(d,cur){normD(d);
  const id=++uid; const W=d.w||800,H=d.h||360;
  let out=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${markers(id)}`;
  (d.z||[]).forEach(z=>{const [x,y,w,h,l,c,step]=z; if(!vis(step,cur))return; const C=col(c);
    out+=`<g class="${cls(step,cur)}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${C}" fill-opacity=".04" stroke="${C}" stroke-opacity=".55" stroke-dasharray="5 4"/>${l?`<text class="ztxt" x="${x+10}" y="${y+15}" fill="${C}">${esc(l)}</text>`:''}</g>`});
  const nodes={};
  (d.n||[]).forEach(n=>{const [w,h]=nodeSize(n);nodes[n[0]]={x:n[1],y:n[2],w,h}});
  (d.e||[]).forEach(e=>out+=drawEdge(e,nodes,cur,id));
  (d.n||[]).forEach(n=>out+=drawNode(n,cur));
  (d.t||[]).forEach(t=>{const [x,y,tx,c,step,size,anc,wt]=t; if(!vis(step,cur))return;
    const a={s:'start',e:'end'}[anc]||'middle';
    String(tx).split('\n').forEach((l,i)=>out+=`<text class="ftxt ${cls(step,cur)}" x="${x}" y="${y+i*(size||12)*1.3}" text-anchor="${a}" font-size="${size||12}" font-weight="${wt||500}" fill="${col(c||'x')}">${esc(l)}</text>`)});
  return out+'</svg>';
}

function drawSeq(q,cur){
  const id=++uid; const W=q.w||800; const A=q.a; const n=A.length; const m=Math.max(70,...A.map(a=>Math.max(84,a.split('|')[0].length*7.6+22)/2+6));
  const xs=A.map((_,i)=>n===1?W/2:m+i*(W-2*m)/(n-1));
  const ai=v=>typeof v==='number'?v:A.findIndex(a=>a.split('|')[0]===v);
  const rh=q.rh||31; const rows=q.m.length; const H=72+rows*rh+14;
  let out=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${markers(id)}`;
  A.forEach((a,i)=>{const [nm,c]=a.split('|');const C=col(c||'b');const w=Math.max(84,nm.length*7.6+22);
    out+=`<line x1="${xs[i]}" y1="44" x2="${xs[i]}" y2="${H-6}" stroke="${C}" stroke-opacity=".35" stroke-dasharray="4 4"/>`;
    out+=`<rect x="${xs[i]-w/2}" y="12" width="${w}" height="32" rx="7" fill="${C}" fill-opacity=".14" stroke="${C}" stroke-width="1.5"/><text x="${xs[i]}" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3" font-family="Inter,sans-serif">${esc(nm)}</text>`});
  q.m.forEach((r,k)=>{const y=72+k*rh;
    if(r[0]==='#'){const [,a,b,tx,c,step]=r; if(!vis(step,cur))return; const C=col(c||'a');
      const i1=ai(a),i2=ai(b==null?a:b); const x1=Math.min(xs[i1],xs[i2])-62,x2=Math.max(xs[i1],xs[i2])+62;
      const w=Math.min(W-8,Math.max(x2-x1,tx.length*6.5+16)); let cx=(x1+x2)/2; cx=Math.max(4+w/2,Math.min(W-4-w/2,cx));
      out+=`<g class="${cls(step,cur)}"><rect x="${cx-w/2}" y="${y-13}" width="${w}" height="22" rx="5" fill="${C}" fill-opacity=".14" stroke="${C}" stroke-opacity=".7"/><text x="${cx}" y="${y+2}" text-anchor="middle" font-size="11.5" fill="${C}" font-family="Inter,sans-serif" font-weight="600">${esc(tx)}</text></g>`;return}
    const [f,t,l,st,step]=r; if(!vis(step,cur))return; const s=st||'';
    const ck=(s.match(/[rgabptk]/)||['x'])[0]; const C=COL[ck];
    const i1=ai(f),i2=ai(t); const dash=s.includes('d')?' stroke-dasharray="6 4"':'';
    let g=`<g class="${cls(step,cur)}">`;
    if(i1===i2){const x=xs[i1];g+=`<path d="M${x},${y-6} h34 v14 h-30" fill="none" stroke="${C}" stroke-width="1.6"${dash} marker-end="url(#m${id}${ck})"/><text x="${x+42}" y="${y+5}" font-size="11.5" fill="${s.match(/[rgabptk]/)?C:'#adbac7'}" font-family="JetBrains Mono,monospace">${esc(l)}</text>`}
    else{const x1=xs[i1]+(i2>i1?3:-3),x2=xs[i2]+(i2>i1?-5:5);
      g+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C}" stroke-width="1.7"${dash} marker-end="url(#m${id}${ck})"/>`;
      if(s.includes('x'))g+=`<text x="${(x1+x2)/2}" y="${y+5}" text-anchor="middle" font-size="15" fill="${COL.r}" font-weight="800">✕</text>`;
      g+=`<text x="${(x1+x2)/2}" y="${y-6}" text-anchor="middle" font-size="11.5" fill="${s.match(/[rgabptk]/)?C:'#adbac7'}" font-family="JetBrains Mono,monospace">${esc(l)}</text>`}
    out+=g+'</g>';});
  return out+'</svg>';
}

function drawFlow(f,cur){
  // f.f: [[label,col,shape,edgeLabel,step],...]
  const W=f.w||800; const items=f.f; const n=items.length; const gap=f.gap||34;
  const bw=Math.min(170,(W-20-(n-1)*gap)/n); const H=f.h||120; const y=H/2;
  const nodes=items.map((it,i)=>[ 'f'+i, 10+bw/2+i*(bw+gap), y, it[0], it[1]||'b', it[2], it[4], bw, f.bh]);
  const edges=items.slice(0,-1).map((it,i)=>['f'+i,'f'+(i+1),it[3]||'',it[5]||'',items[i+1][4]]);
  return drawFree({w:W,h:H,n:nodes,e:edges,t:f.t,z:f.z},cur);
}

function maxStep(s){
  let m=0;
  const scan=arr=>(arr||[]).forEach(x=>{const st=Array.isArray(x)?x:[];});
  if(s.d){normD(s.d);['n','e','z','t'].forEach(k=>(s.d[k]||[]).forEach(x=>{const i={n:6,e:4,z:6,t:4}[k];m=Math.max(m,s0(x[i]))}))}
  if(s.seq)s.seq.m.forEach(r=>m=Math.max(m,s0(r[0]==='#'?r[5]:r[4])));
  if(s.flow)s.flow.f.forEach(r=>m=Math.max(m,s0(r[4])));
  if(s.cap)m=Math.max(m,s.cap.length-1);
  if(s.qa)m=Math.max(m,s.qa.length);
  return m;
}

function cardHTML(c){
  const [k,l,b]=c; const lab={say:'Say this in the interview',trap:'Trap',num:'Numbers',why:'Why it matters',q:'Interviewer asks'}[k];

}
function tableHTML(t){return `<table class="t"><tr>${t.h.map(h=>`<th>${h}</th>`).join('')}</tr>${t.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`}

function renderSlide(s,cur){
  if(s.type==='title'){
    return `<div class="slide title-slide"><div class="kick">${s.k||''}</div><h1>${s.t}</h1><div class="sub">${s.s||''}</div>${s.chips?`<div class="chips">${s.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`:''}${s.cards?`<div class="cards2" style="margin-top:18px">${s.cards.map(cardHTML).join('')}</div>`:''}${s.pts?`<ul class="pts" style="margin-top:16px">${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`:''}</div>`;
  }
  let dg='';
  if(s.d)dg=drawFree(s.d,cur); else if(s.seq)dg=drawSeq(s.seq,cur); else if(s.flow)dg=drawFlow(s.flow,cur);
  const capTxt=s.cap?s.cap[Math.min(cur,s.cap.length-1)]:'';
  const left=dg?`<div><div class="dbox">${dg}</div>${s.cap?`<div class="cap"><span class="sn">${cur+1}/${s.cap.length}</span>${capTxt}</div>`:''}</div>`:'';
  let side='';
  if(s.qa)side+=`<div class="qa">${s.qa.map((x,i)=>`<div class="qi${i<cur?' open':''}"><div class="qq"><span>Q${i+1}</span>${x[0]}</div><div class="qn">${i<cur?x[1]:'<i>Think it through and say your answer out loud, then press → to reveal.</i>'}</div></div>`).join('')}</div>`;
  if(s.tbl)side+=tableHTML(s.tbl);
  if(s.script)side+=`<div class="script">${s.script.map(r=>`<div><span class="tm">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`;
  if(s.pts)side+=`<ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  if(s.c2)side+=`<div class="cards2">${s.c2.map(cardHTML).join('')}</div>`;
  if(s.cards)side+=s.cards.map(cardHTML).join('');
  const full=s.full||!dg||!side;
  return `<div class="slide"><div class="kick">${s.k||s.sec||''}</div><h1>${s.t}</h1>${s.s?`<div class="sub">${s.s}</div>`:''}<div class="grid${full?' full':''}">${left}${side?`<div class="side">${side}</div>`:''}</div></div>`;
}

window.Deck=function(meta,slides){
  document.documentElement.style.setProperty('--accent',meta.accent||'#f0a429');
  document.title=meta.title;
  const secs=[];slides.forEach((s,i)=>{if(!secs.length||secs[secs.length-1].name!==s.sec)secs.push({name:s.sec,i})});
  document.body.innerHTML=`
  <div class="top"><div class="brand">${meta.brand}</div>
   <select class="secsel" id="secsel">${secs.map(x=>`<option value="${x.i}">${esc(x.name)}</option>`).join('')}</select>
   <span class="tbtn" id="ovb">☰ All slides</span>
   <div class="links">${meta.links.map(l=>`<a href="${l[1]}" ${l[1]===meta.self?'class="cur"':''}>${l[0]}</a>`).join('')}</div></div>
  <div class="prog"><div id="pg"></div></div>
  <div class="stage" id="stage"></div>
  <div class="bot"><button class="nbtn" id="pv">← Prev</button><button class="nbtn pri" id="nx">Next →</button>
   <span class="ctr" id="ctr"></span><span class="dots" id="dots"></span>
   <span class="hint">→ / Space: next step · ↓↑: skip slide · A: show all steps · O: overview</span></div>
  <div class="ov" id="ov"></div>`;
  const st=document.getElementById('stage');
  let i=0,step=0;
  try{const h=parseInt(location.hash.slice(1));if(h>0&&h<=slides.length)i=h-1;else{const v=parseInt(localStorage.getItem(meta.key)||'0');if(v>=0&&v<slides.length)i=v}}catch(e){}
  function draw(){
    const s=slides[i];const ms=maxStep(s);
    st.innerHTML=renderSlide(s,step);st.scrollTop=0;
    document.getElementById('pg').style.width=((i+1)/slides.length*100)+'%';
    document.getElementById('ctr').textContent=`${i+1} / ${slides.length}`;
    document.getElementById('dots').innerHTML=ms?Array.from({length:ms+1},(_,k)=>`<i class="${k<=step?'on':''}"></i>`).join(''):'';
    let si=0;secs.forEach((x,k)=>{if(x.i<=i)si=k});document.getElementById('secsel').selectedIndex=si;
    try{localStorage.setItem(meta.key,i);history.replaceState(null,'','#'+(i+1))}catch(e){}
  }
  function redrawKeepScroll(){const y=st.scrollTop;const s=slides[i];st.innerHTML=renderSlide(s,step);st.scrollTop=y;
    const ms=maxStep(s);document.getElementById('dots').innerHTML=ms?Array.from({length:ms+1},(_,k)=>`<i class="${k<=step?'on':''}"></i>`).join(''):'';}
  function go(n,full){if(n<0||n>=slides.length)return;i=n;step=full?maxStep(slides[i]):0;draw()}
  function next(){if(step<maxStep(slides[i])){step++;redrawKeepScroll()}else go(i+1)}
  function prev(){if(step>0){step--;redrawKeepScroll()}else go(i-1,true)}
  document.getElementById('nx').onclick=next;document.getElementById('pv').onclick=prev;
  document.getElementById('secsel').onchange=e=>go(+e.target.value);
  const ov=document.getElementById('ov');
  function openOv(){ov.innerHTML=`<h2>${esc(meta.title)} — all slides <span class="tbtn" onclick="document.getElementById('ov').classList.remove('show')">✕ close (Esc)</span></h2>`+secs.map((x,k)=>{const end=k+1<secs.length?secs[k+1].i:slides.length;
      return `<div class="sec"><h3>${esc(x.name)}</h3><div class="its">${slides.slice(x.i,end).map((s,j)=>`<div class="it${x.i+j===i?' cur':''}" data-i="${x.i+j}"><span>${x.i+j+1}</span>${s.t.replace(/<[^>]+>/g,'')}</div>`).join('')}</div></div>`}).join('');
    ov.classList.add('show');ov.querySelectorAll('.it').forEach(el=>el.onclick=()=>{ov.classList.remove('show');go(+el.dataset.i)})}
  document.getElementById('ovb').onclick=openOv;
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='SELECT')return;
    if(ov.classList.contains('show')){if(e.key==='Escape'||e.key==='o')ov.classList.remove('show');return}
    if(['ArrowRight',' ','PageDown','j'].includes(e.key)){e.preventDefault();next()}
    else if(['ArrowLeft','PageUp','k'].includes(e.key)){e.preventDefault();prev()}
    else if(e.key==='ArrowDown'){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowUp'){e.preventDefault();go(i-1)}
    else if(e.key==='a'||e.key==='A'){step=maxStep(slides[i]);redrawKeepScroll()}
    else if(e.key==='o'||e.key==='Escape'){openOv()}
    else if(e.key==='Home')go(0); else if(e.key==='End')go(slides.length-1);
  });
  let tx=null,ty=null;st.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  st.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?next():prev()}tx=null},{passive:true});
  st.addEventListener('click',e=>{if(e.target.closest('svg'))next()});
  draw();
};
})();
</script>

var TL={"pb1":{"slug":"url-shortener","name":"URL shortener (Bitly)","hook":"It sounds like a toy, but it is the cleanest example of a read-heavy system: almost every request is a redirect.","tldr":["Redirects outnumber new links about 100 to 1, so the design is mostly about serving reads fast.","Generate short codes from a counter encoded in base62: unique by construction, no collision checks.","Put a cache in front of the database; a small share of links gets most clicks, so the hit rate is high."]},"pb2":{"slug":"rate-limiter","name":"Rate limiter","hook":"Every public API needs one, and the obvious implementation has a race condition.","tldr":["Counting per server gives each client N times its limit; the counter must be shared, usually in Redis.","Read-then-write on a shared counter races. Do the refill, check and decrement atomically in one Lua script.","Decide what happens when Redis is down: allow traffic (fail-open) or block it (fail-closed), per endpoint."]},"pb9":{"slug":"business-discovery","name":"Business discovery (Yelp)","hook":"The trap is over-engineering: the whole dataset fits on one database server.","tldr":["Ten million businesses at ~1 KB each is about 10 GB, small enough for one Postgres instance.","Two-dimensional \"near me\" queries need a geospatial index (PostGIS, geohash), not two B-tree indexes.","Keep the average rating correct under concurrent reviews by updating it atomically in the same transaction."]},"pb11":{"slug":"news-feed","name":"News feed (Facebook)","hook":"The canonical fan-out problem: build a personalised feed for billions of users in a few hundred milliseconds.","tldr":["Computing the feed on every read means hundreds of queries per page view, so precompute it when people post.","Push new post IDs into each follower's feed list in Redis (fan-out on write); a feed read becomes one lookup.","Accounts with millions of followers break fan-out on write, so pull their posts at read time instead (hybrid)."]},"pb19":{"slug":"news-aggregator","name":"News aggregator (Google News)","hook":"A feed problem where the feed is the same for everyone in a region, which changes everything.","tldr":["Writes are tiny (new articles); reads spike hard when big news breaks.","Precompute one list per region and category at ingest time instead of querying on every request.","Because the feed is not per-user, a CDN can cache it for a minute and absorb almost all traffic."]},"pb28":{"slug":"local-delivery","name":"Local delivery (Gopuff)","hook":"It looks like an ordering system, but most of the load is people checking what is available near them.","tldr":["Browsing availability is far more frequent than ordering, so cache it and serve it from replicas.","Find nearby warehouses with an in-memory list and a cheap distance filter before calling any travel-time API.","Prevent overselling with conditional stock decrements for every item in one transaction."]},"pb8":{"slug":"dating-app","name":"Dating app (Tinder)","hook":"Swipes are a firehose of writes, and two people swiping right at the same moment must never miss their match.","tldr":["Precompute each user's stack of nearby candidates and hide already-swiped profiles with a Bloom filter.","Swipes are write-heavy and append-only, a good fit for an LSM store like Cassandra.","Detect matches atomically on one key per pair of users, so simultaneous swipes can't both miss each other."]},"pb15":{"slug":"top-k-videos","name":"Top-K videos (YouTube)","hook":"The design falls straight out of one number: hundreds of thousands of views per second.","tldr":["A counter row per video in a database can't take ~800k updates per second.","Stream views through Kafka partitioned by video ID; each consumer counts its videos in memory and keeps a local top-K.","Merge the per-partition top-K lists; the result is exact because each video lives in exactly one partition."]},"pb20":{"slug":"ad-click-aggregator","name":"Ad click aggregator","hook":"Clicks are money, so the numbers must be fast for dashboards and exact for billing.","tldr":["Redirect immediately and publish the click to Kafka; never aggregate raw rows at query time.","A stream processor counts clicks per ad per minute and writes them to a column store for fast queries.","Deduplicate by a signed impression ID, and recount from raw logs in a nightly batch job for billing accuracy."]},"pb18":{"slug":"web-crawler","name":"Web crawler","hook":"Ten billion pages in five days is a pipeline problem, constrained by politeness and network bandwidth.","tldr":["About 23k pages per second; size the fleet by network bandwidth, not CPU.","Split fetching and parsing into separate stages with queues and stored raw pages, so each scales and retries on its own.","Respect per-domain rate limits and robots.txt, and skip already-seen URLs and duplicate content."]},"pb25":{"slug":"metrics-monitoring","name":"Metrics monitoring (Datadog)","hook":"Millions of data points per second arrive, and alerts must fire within a minute.","tldr":["Buffer the write firehose through Kafka into a time-series database built for appends and compression.","Downsample old data and move it to cheap storage; dashboards read rollups.","Evaluate alert rules on the stream itself instead of polling the database."]},"pb21":{"slug":"fitness-tracking","name":"Fitness tracking (Strava)","hook":"The key insight is where the work happens: on the phone, not the server.","tldr":["Record GPS on the device and upload the whole activity when it ends; no need to stream every point.","Store the track in object storage and the metadata in a database, with an idempotent, resumable upload.","Compute stats and leaderboards asynchronously from a queue; leaderboards are Redis sorted sets."]},"pb10":{"slug":"ride-sharing","name":"Ride sharing (Uber)","hook":"Four problems in one: a flood of location updates, matching, locking drivers, and a multi-step trip lifecycle.","tldr":["Driver locations are ephemeral and frequent, so keep them in Redis's geospatial index, not a database.","Offer a ride to one driver at a time and lock that driver with a short TTL so they can't get two offers.","Run ride requests through a durable, per-region queue so a crashed matcher loses nothing."]},"pb12":{"slug":"live-comments","name":"Live comments (Facebook Live)","hook":"One popular stream can mean a million viewers each expecting new comments within a fraction of a second.","tldr":["Polling at this scale is a self-inflicted denial of service; push with Server-Sent Events.","Write each comment once and publish it once; pub/sub fans it out to every server holding viewers of that video.","Route viewers of the same video to the same servers so each server subscribes to few channels."]},"pb16":{"slug":"collaborative-editor","name":"Collaborative editor (Google Docs)","hook":"The challenge is correctness, not scale: everyone must end up with the same document.","tldr":["Send small operations, not whole documents; last-write-wins on documents loses people's work.","One server per document orders operations and transforms concurrent ones (OT); CRDTs are the serverless alternative.","Append every operation to a log before acknowledging it, and snapshot periodically for fast loading."]},"pb22":{"slug":"stock-trading","name":"Stock trading (Robinhood)","hook":"Two separate problems: pushing live prices to millions, and never losing or duplicating an order.","tldr":["Prices: one consumer of the exchange feed publishes per symbol; push servers subscribe and stream to clients.","Orders: persist the order as pending with your own ID before sending it to the exchange.","Treat exchange calls as having unknown outcomes; reconcile by your order ID instead of resubmitting."]},"pb6":{"slug":"online-auction","name":"Online auction","hook":"Many people bid on one row at the same time, and exactly one of them must win each race.","tldr":["Comparing bids in application code loses updates under concurrency.","Accept a bid with one conditional update: set the new maximum only if it beats the current one and the auction is open.","Push accepted bids to watchers in real time; for very hot auctions, serialize bids through a partitioned log."]},"pb29":{"slug":"llm-chat","name":"LLM chat (ChatGPT)","hook":"GPUs are the scarce resource, so every queueing decision is really a cost decision.","tldr":["Stream tokens to the client as they are generated so the first words appear in under a second.","Put a queue with priorities in front of the GPU pool for backpressure, fairness and batching.","Buffer tokens per message so a client that reconnects can resume where it left off."]},"pb23":{"slug":"chat-app","name":"Chat app (WhatsApp)","hook":"Chat looks like CRUD until you notice the two users are on different servers and one of them is offline.","tldr":["Keep a persistent WebSocket per device; route messages between chat servers with a registry and per-user pub/sub.","Persist each message and add it to the recipient's inbox before acknowledging the sender, so nothing is lost.","Partition by conversation and number messages within it so every device shows the same order."]},"pb26":{"slug":"payment-system","name":"Payment system (Stripe)","hook":"Throughput is moderate. The hard part is staying correct when a call to the bank has an unknown outcome.","tldr":["Record the payment as pending before calling the processor, and pass your ID as the idempotency key.","On a timeout, query by that key or retry it; never create a second charge.","Publish status changes through an outbox, keep an append-only double-entry ledger, and reconcile daily."]},"pb4":{"slug":"online-judge","name":"Online judge (LeetCode)","hook":"You are running strangers' code on your servers, so isolation comes first.","tldr":["Run every submission in a locked-down sandbox: no network, read-only filesystem, strict CPU, memory and time limits.","Queue submissions and return immediately; workers autoscale on queue depth and the client polls for results.","Keep contest leaderboards in a Redis sorted set."]},"pb24":{"slug":"job-scheduler","name":"Job scheduler","hook":"Ten thousand jobs per second, each within two seconds of its scheduled time.","tldr":["Cron on one machine is a single point of failure that can't scale.","Store executions partitioned by time; a poller moves soon-due jobs into a delay queue that releases each on time.","Workers lease jobs with a visibility timeout, so crashed jobs are retried; jobs must be idempotent."]},"pb14":{"slug":"video-platform","name":"Video platform (YouTube)","hook":"Two hard problems: getting gigabyte uploads in reliably, and streaming smoothly on any connection.","tldr":["Upload directly to object storage with presigned, multipart, resumable URLs; bytes never touch your servers.","Split videos into segments and transcode them in parallel into several resolutions.","Serve segments from a CDN and let the player switch quality per segment (adaptive bitrate)."]},"pb17":{"slug":"file-sync","name":"File storage and sync (Dropbox)","hook":"Syncing a 50 GB file after a one-byte edit should not mean uploading 50 GB again.","tldr":["Split files into chunks fingerprinted by hash, and upload only the chunks the server doesn't already have.","Upload and download directly to object storage with presigned URLs.","Other devices follow a per-user change log with a cursor and fetch only what changed."]},"pb7":{"slug":"photo-sharing","name":"Photo sharing (Instagram)","hook":"A news feed plus a media pipeline: two well-known problems combined.","tldr":["Upload media straight to object storage; process thumbnails and sizes asynchronously; serve them from a CDN.","Build feeds with fan-out on write into Redis, and pull celebrity posts at read time.","Show a post only once its media has finished processing."]},"pb3":{"slug":"distributed-cache","name":"Distributed cache","hook":"Design Redis itself: data structures inside one node, then distribution across many.","tldr":["One node is a hash map plus a doubly linked list for O(1) least-recently-used eviction.","Spread keys with consistent hashing and virtual nodes, so adding a node moves only a small share of keys.","Replicate asynchronously for failover, and spread hot keys over several nodes."]},"pb13":{"slug":"post-search","name":"Post search (Facebook)","hook":"Search over billions of posts, where like counts change constantly.","tldr":["Build an inverted index (term → post IDs) from the stream of new posts, sharded by term.","Keep two orderings per term, recency and likes, and update like-based ranking only at thresholds or in batches.","Keep hot postings in memory, move old ones to cheaper storage, and cache popular queries."]},"pb27":{"slug":"price-tracker","name":"Price tracker (CamelCamelCamel)","hook":"Five hundred million products can't all be crawled often, so decide what is worth checking.","tldr":["Prioritise crawling by how many people track a product and how often its price changes.","Add crowd-sourced prices from a browser extension, validated before they trigger alerts.","Make alerts event-driven: when a price drops, look up subscriptions for that product only."]},"pb5":{"slug":"ticketmaster","name":"Ticketmaster","handwritten":true,"hook":"Millions of people arrive for one on-sale, and no seat may ever be sold twice.","tldr":["Browsing is huge, read-only traffic that can be slightly stale: cache it hard.","Hold a seat with one atomic conditional update so two buyers can never both win.","For huge on-sales, a virtual waiting room admits users at the rate the system can handle."]}};

const QF=[
 ['Cache-aside vs write-through?','Cache-aside: app reads cache, on miss reads DB and fills cache; writes update DB then delete key. Write-through writes both synchronously: fresher, slower writes.'],
 ['How do you stop a cache stampede?','Single-flight lock per key (only one request recomputes), jittered TTLs, serve stale while revalidating, pre-warm hot keys.'],
 ['SSE vs WebSocket vs long polling?','SSE: server→client over HTTP with auto-reconnect. WebSocket: bidirectional, stateful. Long polling: fallback. Pick the simplest that fits the traffic direction.'],
 ['Two users book the last seat. What exactly goes wrong and how do you fix it?','Check-then-act race (write skew). An atomic conditional UPDATE … WHERE status=AVAILABLE, or a lock with TTL; exactly one row update succeeds.'],
 ['Why not 2PC across microservices?','It blocks on coordinator failure and couples availability. Use a saga with compensations, outbox, and idempotent consumers.'],
 ['What is the outbox pattern?','Write the business row and an event row in one local transaction; a relay/CDC publishes the event. No dual-write inconsistency.'],
 ['At-least-once vs exactly-once?','Delivery is at-least-once in practice; make processing idempotent (dedupe by ID, upserts) to get an effectively-once result.'],
 ['When do you shard?','When the calculated write load or data size exceeds one primary (~10–50k TPS, multiple TB) after caching and replicas. Pick the key from the hottest query.'],
 ['Consistent hashing in one sentence?','Nodes and keys on a ring, key → next node clockwise; adding a node moves ~1/N of keys; virtual nodes balance load.'],
 ['Hot key, e.g., a celebrity or viral item?','Split the key with suffixes, cache with local L1, buffer writes and aggregate, or special-case it (hybrid fan-out).'],
 ['Presigned URLs: why?','Clients upload and download directly to object storage; app servers never carry the bytes; multipart allows resumable parallel chunks.'],
 ['Kafka vs SQS?','Kafka: ordered partitions, replay, multiple consumer groups, stream processing. SQS: simple task queue with per-message retry, visibility timeout, DLQ.'],
 ['How do you make an API retry-safe?','Client-generated Idempotency-Key stored with a unique constraint; return the stored result on duplicates.'],
 ['Replication lag bites how?','Read-your-writes failures, non-monotonic reads, causally reordered reads. Fixes: read-from-leader after write, sticky replicas, partition by causal key.'],
 ['Redis lock is enough for correctness?','No. GC pauses or clock issues can leave two holders. Add a fencing token checked by the resource, or use DB conditional writes.'],
 ['CAP in an interview?','Per feature: during a partition choose to reject (CP) or serve stale (AP). Booking and payments CP; feeds and search AP.'],
 ['p99 vs average?','Users feel the tail; with fan-out, tail latency compounds. Set SLOs on p99; use timeouts and hedged requests.'],
 ['LSM vs B-tree?','LSM: sequential writes, compaction, great for write-heavy (Cassandra). B-tree: in-place pages, predictable reads, transactions (Postgres).']];
