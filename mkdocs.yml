site_name: System Design, Step by Step
site_description: A free, diagram-first system design handbook. Start simple, find the break, fix only that.
site_url: https://khanhafizurrahman32.github.io/System-design-step-by-step/
repo_url: https://github.com/khanhafizurrahman32/System-design-step-by-step
edit_uri: edit/main/docs/
exclude_docs: |
  diagrams/README.md
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
extra_css:
  - assets/extra.css
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - admonition
  - github-callouts
  - md_in_html
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight
